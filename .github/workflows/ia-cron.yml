name: Follow-up IA (9h BRT)

# Cron confiável do follow-up automático (independe do limite de cron do plano Vercel).
# Roda todo dia 12:00 UTC = 09:00 de Brasília: reconcilia a posse e dispara o motor de follow-up.
on:
  # ⚠️ AGENDAMENTO MIGRADO pro pg_cron do Supabase (mais confiável). Mantido só o disparo MANUAL.
  # Não reative o schedule aqui senão roda em dobro com o pg_cron.
  workflow_dispatch: {}

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Warming dos resumos (gera etapaReal dos leads sem resumo, aos poucos)
        run: |
          for i in $(seq 1 25); do
            REST=$(curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/resumos" -H "Content-Type: application/json" -d '{"limit":8}' | sed -n 's/.*"restantes":\([0-9]*\).*/\1/p')
            echo "warming rodada $i -> restantes: ${REST:-?}"
            [ "$REST" = "0" ] && break
          done
      - name: Rede de seguranca — recupera a virada de ONTEM (se o cron das 23h falhou)
        run: |
          ONTEM=$(date -u -d 'yesterday' +%F)
          for i in $(seq 1 20); do
            REST=$(curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/virada" -H "Content-Type: application/json" -d "{\"dryRun\":false,\"confirm\":true,\"limit\":8,\"data\":\"$ONTEM\"}" | sed -n 's/.*"restantes":\([0-9]*\).*/\1/p')
            echo "virada($ONTEM) rodada $i -> restantes: ${REST:-?}"
            [ "$REST" = "0" ] && break
            sleep 2
          done
      - name: Reconciliar posse (esfriou->IA, quente->time)
        run: |
          curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/reconciliar" \
            -H "Content-Type: application/json" \
            -d '{"dryRun":false,"confirm":true,"dias":3}'
      - name: Motor de follow-up (le o cache + interpreta + manda)
        run: |
          curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/followup-auto" \
            -H "Content-Type: application/json" \
            -d '{"dryRun":false,"confirm":true,"limit":120}'
      - name: Sync leads -> pool de disparo (catch-up, caso a virada da noite tenha falhado)
        run: |
          curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/sync-pool" -H "Content-Type: application/json" -d '{"dryRun":false,"confirm":true,"limit":800}' > /dev/null
          curl -s -X POST "https://carreiranodigital.vercel.app/api/ia/sync-pool" -H "Content-Type: application/json" -d '{"dryRun":false,"confirm":true,"limit":800}' | sed -n 's/.*"inseridos":\([0-9]*\).*/inseridos: \1/p'
