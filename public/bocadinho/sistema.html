<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#1f3a32"></head><body>
<title>Bocadinho Doceria — Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece0;--card:#faf6ef;--tx:#1f3a32;--tx2:#5b6c63;--ac:#9c7c45;--ac2:#e6dcc7;--ok:#3f6b3a;--warn:#a63d2a;--line:#e0d5c2;--chip:#ebe2d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14261f;--card:#1f3a32;--tx:#f3ece0;--tx2:#b9c4bb;--ac:#c9ab72;--ac2:#2c4a41;--ok:#9dbb6e;--warn:#ef8a70;--line:#36564b;--chip:#2a463c}}
:root[data-theme="dark"]{--bg:#14261f;--card:#1f3a32;--tx:#f3ece0;--tx2:#b9c4bb;--ac:#c9ab72;--ac2:#2c4a41;--ok:#9dbb6e;--warn:#ef8a70;--line:#36564b;--chip:#2a463c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:baseline;gap:10px}
header h1{font:300 28px Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}header small{font:800 10px "Nunito Sans";letter-spacing:.45em;text-transform:uppercase;color:var(--ac);margin-left:6px}
header span{color:var(--tx2);font-size:13px}
main{max-width:860px;margin:0 auto;padding:16px 16px 110px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--tx2);font:700 12px 'Nunito Sans';padding:8px 2px;border-radius:10px;cursor:pointer}
nav button b{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--tx);background:var(--chip)}
h2{font:500 24px Fraunces,Georgia,serif;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--tx2);font-size:14px}
.big{font:500 30px Fraunces,Georgia,serif;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.grid .card{margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);font:700 14px 'Nunito Sans';padding:9px 13px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wa{background:#2f7d4f;border-color:#2f7d4f;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--tx);border-radius:999px;padding:6px 12px;font:700 13px 'Nunito Sans';cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;background:var(--chip);color:var(--tx2)}
.tag.aguardando_pix{background:#f3e2bd;color:#6e4e12}.tag.pago{background:#dbe7d3;color:#2f5130}.tag.produzindo{background:#e6dcc7;color:#5a4a26}.tag.pronto{background:#cfe0ea;color:#24465a}.tag.entregue{background:#e6e1db;color:#5d544c}.tag.cancelado{background:#f1d1c9;color:#7b2e1e}
.bar{height:30px;border-radius:8px;background:var(--ac2);position:relative;overflow:hidden;margin:4px 0}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ac)}
.bar span{position:relative;padding:0 10px;line-height:30px;font-weight:800;font-size:14px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right}
.tbl{overflow-x:auto}
input,select,textarea{width:100%;font:16px 'Nunito Sans';color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px;color:var(--tx2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font:800 18px 'Nunito Sans';cursor:pointer}
.step b{min-width:22px;text-align:center}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(10,24,18,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.aviso{background:#f3e2bd;color:#5c4210;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.vazio{color:var(--tx2);text-align:center;padding:22px 8px}
.tot{font:500 24px Fraunces,Georgia,serif}
@media (max-width:480px){.f2{grid-template-columns:1fr}}
</style>

<header><h1>bocadinho<small>doceria</small></h1><span id="sub">sistema</span></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<nav id="nav"></nav>
<div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
// ---------- dados fixos do negócio (preços e composição; os preços podem ser trocados em Ajustes) ----------
const KITS=[
 {id:'boc',desc:'16 mini cookies + 1 molho',nome:'Bocadinho',preco:39.9,cookies:16,brownies:0,molhos:1,caixa:'caixaP',saq:1,sacola:0,custo:15.47},
 {id:'div',desc:'30 mini cookies + 4 brownies + 2 molhos',nome:'Pra dividir',preco:79.9,cookies:30,brownies:4,molhos:2,caixa:'caixaM',saq:2,sacola:1,custo:29.75},
 {id:'fam',desc:'50 mini cookies + 9 brownies + 3 molhos',nome:'Família',preco:129.9,cookies:50,brownies:9,molhos:3,caixa:'caixaG',saq:3,sacola:1,custo:49.38},
 {id:'bro',desc:'12 cubinhos de brownie + 1 molho',nome:'Caixinha de brownie',preco:39.9,cookies:0,brownies:12,molhos:1,caixa:'caixaP',saq:1,sacola:0,custo:13.70},
 {id:'mim',desc:'8 mini cookies + 1 molho + cartão da empresa (mín. 20)',nome:'Mimo de empresa',preco:22.9,cookies:8,brownies:0,molhos:1,caixa:'caixaMimo',saq:1,sacola:0,custo:8.30}]
const MOLHOS=[{id:'avela',nome:'Avelã'},{id:'ddl',nome:'Doce de leite'},{id:'ninho',nome:'Ninho'},{id:'pistache',nome:'Pistache (+R$ 5)'}]
const ENTREGAS=[{id:'retirada',nome:'Retirada no centro',taxa:0},{id:'estrela',nome:'Entrega em Estrela',taxa:8},{id:'lajeado',nome:'Lajeado / Teutônia',taxa:15}]
const STATUS=[['aguardando_pix','Aguardando Pix'],['pago','Pago'],['produzindo','Produzindo'],['pronto','Pronto'],['entregue','Entregue'],['cancelado','Cancelado']]
const ETAPAS=[['conversa','Conversando'],['cardapio','Cardápio enviado'],['pedido','Fez pedido'],['perdido','Não comprou']]
const ORIGENS_PADRAO=['A1','A2','A3','A4','A5','A6','Instagram','Indicação','Cliente de novo','Outro']
const CATS=[['ingredientes','Ingredientes'],['embalagens','Embalagens'],['anuncio','Anúncio (Meta)'],['mei','MEI / impostos'],['utensilios','Utensílios'],['outros','Outros']]
const ESTOQUE_NOMES={caixaP:'Caixa P (Bocadinho / brownie)',caixaM:'Caixa M (Pra dividir)',caixaG:'Caixa G (Família)',caixaMimo:'Caixinha do mimo',potinho:'Potinho 50 ml',rotulo:'Rótulo de potinho',saquinho:'Saquinho interno',adesivo:'Selo da logo',cartao:'Cartão',sacola:'Sacola kraft'}
const COOKIES_POR_FORNADA=160, CUBOS_POR_FORMA=96

let db=null, S={contatos:[],pedidos:[],gastos:[],estoque:{},config:{},tab:'hoje',fPed:'abertos',fCon:'abertos',per:'30',mes:'',prodDia:''}

// ---------- utilidades ----------
const $=s=>document.querySelector(s)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const R=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—'
const pad=n=>String(n).padStart(2,'0')
const dia=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
const somaDias=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dia(d)}
const diaBR=s=>{if(!s)return'—';const[a,m,d]=s.split('-');const hj=dia();if(s===hj)return'hoje';if(s===somaDias(hj,1))return'amanhã';return d+'/'+m}
const so=s=>String(s||'').replace(/\D/g,'')
const kit=id=>KITS.find(k=>k.id===id)
const preco=k=>Number(S.config.precos?.[k.id]??k.preco)
const taxa=e=>Number(S.config.taxas?.[e]??(ENTREGAS.find(x=>x.id===e)?.taxa||0))
const origens=()=>S.config.origens?.length?S.config.origens:ORIGENS_PADRAO
const pago=p=>['pago','produzindo','pronto','entregue'].includes(p.status)
const daAnuncio=o=>/^A\d+$/i.test(o||'')

function contaPedido(p){
  let itens=0,incl=0
  for(const it of p.itens||[]){const k=kit(it.kit);if(!k)continue;itens+=preco(k)*it.qtd;incl+=k.molhos*it.qtd}
  const m=p.molhos||{};const nm=Object.values(m).reduce((a,b)=>a+(Number(b)||0),0)
  const extras=Math.max(0,nm-incl)*8, pist=(Number(m.pistache)||0)*5, tx=taxa(p.entrega)
  return {itens,extras,pist,tx,total:itens+extras+pist+tx,incl,nm}
}
function custoPedido(p){return (p.itens||[]).reduce((a,it)=>a+(kit(it.kit)?.custo||0)*it.qtd,0)}
function resumoItens(p){return (p.itens||[]).filter(i=>i.qtd>0).map(i=>i.qtd+'× '+(kit(i.kit)?.nome||i.kit)).join(', ')||'—'}
function resumoMolhos(p){const m=p.molhos||{};return MOLHOS.filter(x=>m[x.id]>0).map(x=>m[x.id]+' '+x.nome.replace(' (+R$ 5)','').toLowerCase()).join(', ')||'—'}
function noPeriodo(iso){if(!iso)return false;if(S.per==='tudo')return true;const lim=somaDias(dia(),-(Number(S.per)-1));return iso.slice(0,10)>=lim}
function wa(num,txt){const n=so(num);return 'https://wa.me/'+(n.length<=11?'55'+n:n)+'?text='+encodeURIComponent(txt)}

// ---------- mensagens prontas ----------
function msgCardapio(nome){return `Oi${nome?', '+nome.split(' ')[0]:''}! Aqui é a Bocadinho Doceria 🍪 Que bom te ver por aqui!\n\nNosso cardápio:\n`+KITS.map(k=>`• ${k.nome} — ${k.desc} — ${R(preco(k))}${k.id==='mim'?' cada':''}`).join('\n')+`\n\nMolhos: avelã, doce de leite ou Ninho (pistache +R$ 5).\nEncomendas com 1 dia de antecedência. Retirada grátis no centro de Estrela ou entrega (Estrela ${R(taxa('estrela'))}, Lajeado/Teutônia ${R(taxa('lajeado'))}).\n\nQual caixa combina com o teu momento? 🤎`}
function msgPix(p){const c=contaPedido(p);return `Perfeito, ${(p.nome||'').split(' ')[0]}! Teu pedido:\n${resumoItens(p)}\nMolhos: ${resumoMolhos(p)}\n${(ENTREGAS.find(e=>e.id===p.entrega)||{}).nome||''} — ${diaBR(p.dataEntrega)==='hoje'||diaBR(p.dataEntrega)==='amanhã'?diaBR(p.dataEntrega):'dia '+diaBR(p.dataEntrega)}${p.hora?' às '+p.hora:''}\n\nTotal: ${R(c.total)}\nChave Pix: ${S.config.pix||'[cadastrar a chave Pix em Ajustes]'}\n\nAssim que cair, confirmo e teu pedido já entra na fornada 🍪`}
function msgPronto(p){return p.entrega==='retirada'?`${(p.nome||'').split(' ')[0]}, teu pedido saiu do forno e está pronto pra retirar! 🍪 ${S.config.endereco?'Endereço: '+S.config.endereco:''}`:`${(p.nome||'').split(' ')[0]}, teu pedido saiu do forno e já está a caminho! 🍪`}
function msgPos(p){return `Oi, ${(p.nome||'').split(' ')[0]}! Conseguiu mergulhar? 😄 Se tirar uma foto, manda pra gente — a gente adora ver! 🤎`}

// ---------- banco ----------
let senha='';try{senha=localStorage.getItem('bocadinho_senha')||''}catch(e){}
async function api(method,q,body){
  const r=await fetch('/api/bocadinho'+(q||''),{method,headers:{'Content-Type':'application/json','x-bocadinho-senha':senha},body:body?JSON.stringify(body):undefined})
  if(r.status===401){sair();throw{code:'senha',message:'senha'}}
  const j=await r.json().catch(()=>({ok:false,erro:'servidor'}));if(!j.ok)throw{code:j.erro||'erro',message:j.erro||'erro'};return j
}
function criaDb(){
  const ouv={},docOuv=[]
  async function carrega(col){
    const j=await api('GET','?col='+col)
    const docs=j.docs.map(d=>{const{id,...resto}=d;return{id,exists:true,data:()=>resto}})
    ;(ouv[col]||[]).forEach(f=>f({docs}))
    docOuv.filter(o=>o.col===col).forEach(o=>o.fn(docs.find(x=>x.id===o.id)||{exists:false,data:()=>undefined}))
  }
  const novoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8)
  const ref=(col,id)=>({id,
    set:async d=>{await api('POST','',{acao:'set',col,id,dados:d});carrega(col).catch(()=>{})},
    update:async d=>{await api('POST','',{acao:'update',col,id,dados:d});carrega(col).catch(()=>{})},
    delete:async()=>{await api('POST','',{acao:'delete',col,id});carrega(col).catch(()=>{})},
    onSnapshot:(fn)=>{docOuv.push({col,id,fn});carrega(col).catch(()=>{});return()=>{}}})
  setInterval(()=>{if(document.hidden)return;new Set([...Object.keys(ouv),...docOuv.map(o=>o.col)]).forEach(c=>carrega(c).catch(()=>{}))},15000)
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)new Set([...Object.keys(ouv),...docOuv.map(o=>o.col)]).forEach(c=>carrega(c).catch(()=>{}))})
  return{collection:c=>({doc:id=>ref(c,id||novoId()),add:async d=>{const r=ref(c,novoId());await r.set(d);return r},onSnapshot:(fn,err)=>{(ouv[c]=ouv[c]||[]).push(fn);carrega(c).catch(e=>err&&err(e));return()=>{}}}),doc:p=>{const[c,id]=p.split('/');return ref(c,id)}}
}
function sair(){senha='';try{localStorage.removeItem('bocadinho_senha')}catch(e){}telaLogin()}
function telaLogin(msg){
  $('#nav').innerHTML=''
  $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><h2 style="margin-top:4px">Entrar</h2><p class="mut">Digite a senha do sistema da Bocadinho.</p><input id="lgSenha" type="password" autocomplete="current-password" style="text-align:center"><p class="mut" id="lgMsg" style="color:var(--warn)">${msg||''}</p><button class="btn pri" id="lgBtn" style="width:100%;justify-content:center">Entrar</button></div>`
  const vai=async()=>{senha=$('#lgSenha').value.trim();try{await api('POST','',{acao:'login'});try{localStorage.setItem('bocadinho_senha',senha)}catch(e){}location.reload()}catch(e){telaLogin('Senha errada.')}}
  $('#lgBtn').onclick=vai;$('#lgSenha').onkeydown=e=>{if(e.key==='Enter')vai()};$('#lgSenha').focus()
}
async function iniciar(){
  if(!senha){telaLogin();return}
  try{await api('POST','',{acao:'login'})}catch(e){if(e.code!=='senha'){S.semDb=true;render()}return}
  db=criaDb()
  render()
  const ouvir=(col,fn)=>db.collection(col).onSnapshot(fn,e=>{S.erro='Falha ao ler '+col+' ('+e.code+')';render()})
  ouvir('contatos',s=>{S.contatos=s.docs.map(d=>({id:d.id,...d.data()}));render()})
  ouvir('pedidos',s=>{S.pedidos=s.docs.map(d=>({id:d.id,...d.data()}));render()})
  ouvir('gastos',s=>{S.gastos=s.docs.map(d=>({id:d.id,...d.data()}));render()})
  ouvir('estoque',s=>{const e={};s.docs.forEach(d=>e[d.id]=d.data());S.estoque=e;render()})
  db.doc('config/geral').onSnapshot(s=>{S.config=s.exists?s.data():{};render()},()=>{})
}
async function grava(fn,ok){
  if(!db){alert('Sem conexão com o servidor. Recarregue a página.');return false}
  try{await fn();if(ok)toast(ok);return true}catch(e){alert('Não consegui salvar: '+(e.code==='quota_exceeded'?'o banco está cheio. Apague registros antigos.':e.code==='senha'?'a senha expirou, entre de novo.':e.message||e.code));return false}
}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:20';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

// ---------- baixa no estoque quando o pedido fica pronto ----------
function consumo(p){
  const c={};const add=(k,n)=>{if(n)c[k]=(c[k]||0)+n}
  for(const it of p.itens||[]){const k=kit(it.kit);if(!k)continue;add(k.caixa,it.qtd);add('adesivo',it.qtd);add('cartao',it.qtd);add('saquinho',k.saq*it.qtd);add('sacola',k.sacola*it.qtd)}
  const nm=Object.values(p.molhos||{}).reduce((a,b)=>a+(Number(b)||0),0);add('potinho',nm);add('rotulo',nm)
  return c
}
async function mudaStatus(p,st){
  const dados={status:st,atualizadoEm:new Date().toISOString()}
  await grava(async()=>{
    if(st==='pronto'&&!p.baixaFeita){
      for(const[k,n]of Object.entries(consumo(p))){if(S.estoque[k])await db.doc('estoque/'+k).update({qtd:Math.max(0,(Number(S.estoque[k].qtd)||0)-n)})}
      dados.baixaFeita=true
    }
    if(st==='cancelado'&&p.baixaFeita){
      for(const[k,n]of Object.entries(consumo(p))){if(S.estoque[k])await db.doc('estoque/'+k).update({qtd:(Number(S.estoque[k].qtd)||0)+n})}
      dados.baixaFeita=false
    }
    await db.doc('pedidos/'+p.id).update(dados)
  },'Pedido: '+STATUS.find(s=>s[0]===st)[1])
}

// ---------- telas ----------
const TABS=[['hoje','🏠','Hoje'],['pedidos','🧾','Pedidos'],['contatos','💬','Conversas'],['producao','🍪','Produção'],['numeros','📊','Números'],['caixa','💰','Caixa'],['ajustes','⚙️','Ajustes']]
function render(){
  $('#nav').innerHTML=TABS.map(([id,ic,n])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}"><b>${ic}</b>${n}</button>`).join('')
  $('#sub').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})
  let h=''
  if(S.semDb)h+=`<div class="aviso">Sem conexão com o servidor. Confira a internet e recarregue a página.</div>`
  if(S.erro)h+=`<div class="aviso">${esc(S.erro)}</div>`
  h+=({hoje:telaHoje,pedidos:telaPedidos,contatos:telaContatos,producao:telaProducao,numeros:telaNumeros,caixa:telaCaixa,ajustes:telaAjustes}[S.tab])()
  $('#app').innerHTML=h
}
function cardPedido(p){
  const c=contaPedido(p)
  return `<div class="card"><div class="row"><h3 style="margin:0">${esc(p.nome||'Sem nome')}</h3><span class="tag ${p.status}">${STATUS.find(s=>s[0]===p.status)?.[1]||p.status}</span><span class="sp"></span><b>${R(c.total)}</b></div>
  <div class="mut">${esc(resumoItens(p))} · molhos: ${esc(resumoMolhos(p))}</div>
  <div class="mut">${diaBR(p.dataEntrega)}${p.hora?' '+esc(p.hora):''} · ${(ENTREGAS.find(e=>e.id===p.entrega)||{}).nome||''}${p.origem?' · origem '+esc(p.origem):''}</div>
  <div class="row" style="margin-top:8px">${botoesStatus(p)}<span class="sp"></span><button class="btn sm" data-act="abrePedido" data-id="${p.id}">Abrir</button></div></div>`
}
function botoesStatus(p){

  <label>Observação (cartão, recado, endereço)</label><textarea id="fpObs" rows="2">${esc(F.obs)}</textarea>
  <div class="card" style="margin-top:12px"><div class="row"><span>Caixas</span><span class="sp"></span>${R(c.itens)}</div>${c.extras?`<div class="row"><span>Molhos extras</span><span class="sp"></span>${R(c.extras)}</div>`:''}${c.pist?`<div class="row"><span>Pistache</span><span class="sp"></span>${R(c.pist)}</div>`:''}${c.tx?`<div class="row"><span>Entrega</span><span class="sp"></span>${R(c.tx)}</div>`:''}<div class="row"><b>Total</b><span class="sp"></span><span class="tot">${R(c.total)}</span></div>${c.nm<c.incl?`<div class="mut">Faltam escolher ${c.incl-c.nm} molho(s).</div>`:''}</div>
  <div class="row" style="margin-top:14px"><button class="btn pri" data-act="salvaPedido">Salvar pedido</button><button class="btn" data-act="fecha">Fechar</button>${F.wa&&F.status==='aguardando_pix'?`<a class="btn wa" target="_blank" rel="noopener" href="${wa(F.wa,msgPix(F))}">Mandar Pix</a>`:''}${F.id?`<span class="sp"></span><button class="btn sm" data-act="apagaPedido">Apagar</button>`:''}</div>`)
}
function lePedidoForm(){F.nome=$('#fpNome').value.trim();F.wa=$('#fpWa').value.trim();F.dataEntrega=$('#fpDia').value;F.hora=$('#fpHora').value.trim();F.pagamento=$('#fpPag').value;F.status=$('#fpSt').value;F.obs=$('#fpObs').value.trim()}
function formGasto(){
  abreSheet(`<h2 style="margin-top:0">Lançar gasto</h2><label>Tipo</label><select id="fgCat">${CATS.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select>
  <label>Descrição</label><input id="fgDesc" placeholder="ex.: Gotas Melken 2 kg"><div class="f2"><div><label>Valor (R$)</label><input id="fgVal" type="number" step="0.01" inputmode="decimal"></div><div><label>Data</label><input id="fgDia" type="date" value="${dia()}"></div></div>
  <div class="row" style="margin-top:16px"><button class="btn pri" data-act="salvaGasto">Salvar</button><button class="btn" data-act="fecha">Cancelar</button></div>`)
}

// ---------- cliques ----------
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act]');if(!t)return
  if(t.dataset.tab){S.tab=t.dataset.tab;render();scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v
  const ped=()=>S.pedidos.find(p=>p.id===id), con=()=>S.contatos.find(c=>c.id===id)
  switch(a){
   case 'fecha':fechaSheet();break
   case 'fPed':S.fPed=v;render();break
   case 'fCon':S.fCon=v;render();break
   case 'per':S.per=v;render();break
   case 'prodHoje':S.prodDia=dia();render();break
   case 'prodAmanha':S.prodDia=somaDias(dia(),1);render();break
   case 'novoContato':formContato();break
   case 'editaContato':formContato(con());break
   case 'pick':t.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t));break
   case 'salvaContato':{
     const nome=$('#fcNome').value.trim(),w=$('#fcWa').value.trim(),o=$('#fcOri .chip.on')?.dataset.v||'',obs=$('#fcObs').value.trim()
     if(!nome&&!w){alert('Coloque pelo menos o nome ou o WhatsApp.');return}
     const ok=await grava(async()=>{if(id)await db.doc('contatos/'+id).update({nome,wa:w,origem:o,obs,etapa:$('#fcEt').value});else await db.collection('contatos').add({nome,wa:w,origem:o,obs,etapa:'conversa',criadoEm:new Date().toISOString()})},'Conversa salva')
     if(ok)fechaSheet();break}
   case 'apagaContato':if(confirm('Apagar esta conversa?')){await grava(()=>db.doc('contatos/'+id).delete(),'Apagada');fechaSheet()}break
   case 'cardapio':grava(()=>db.doc('contatos/'+id).update({etapa:'cardapio'}));break
   case 'etapa':grava(()=>db.doc('contatos/'+id).update({etapa:v}));break
   case 'viraPedido':{const c=con();formPedido({contatoId:c.id,nome:c.nome,wa:c.wa,origem:c.origem,obs:c.obs});break}
   case 'novoPedido':formPedido();break
   case 'abrePedido':formPedido(ped());break
   case 'fpOri':lePedidoForm();F.origem=v;desenhaPedido();break
   case 'fpEnt':lePedidoForm();F.entrega=v;desenhaPedido();break
   case 'qtd':lePedidoForm();{const i=+t.dataset.i;F.itens[i].qtd=Math.max(0,F.itens[i].qtd+(+t.dataset.d))}desenhaPedido();break
   case 'mol':lePedidoForm();F.molhos[t.dataset.m]=Math.max(0,(F.molhos[t.dataset.m]||0)+(+t.dataset.d));desenhaPedido();break
   case 'salvaPedido':{
     lePedidoForm()
     if(!F.itens.some(i=>i.qtd>0)){alert('Escolha pelo menos uma caixa.');return}
     if(!F.nome){alert('Coloque o nome do cliente.');return}
     const antes=F.id?S.pedidos.find(p=>p.id===F.id):null
     const c=contaPedido(F)
     const dados={contatoId:F.contatoId,nome:F.nome,wa:F.wa,origem:F.origem,itens:F.itens.filter(i=>i.qtd>0),molhos:F.molhos,entrega:F.entrega,dataEntrega:F.dataEntrega,hora:F.hora,pagamento:F.pagamento,obs:F.obs,total:Math.round(c.total*100)/100,atualizadoEm:new Date().toISOString()}
     const ok=await grava(async()=>{
       if(F.id)await db.doc('pedidos/'+F.id).update(dados)
       else{const r=db.collection('pedidos').doc();F.id=r.id;await r.set({...dados,status:'aguardando_pix',baixaFeita:false,criadoEm:new Date().toISOString()})}
       if(F.contatoId)await db.doc('contatos/'+F.contatoId).update({etapa:'pedido',pedidoId:F.id})
     },'Pedido salvo')
     if(!ok)return
     const atual={...(antes||{}),...dados,id:F.id,status:antes?antes.status:'aguardando_pix',baixaFeita:antes?!!antes.baixaFeita:false}
     if(F.status!==atual.status)await mudaStatus(atual,F.status)
     fechaSheet();break}
   case 'apagaPedido':if(confirm('Apagar este pedido? (Se preferir manter o histórico, use “Cancelado”.)')){await grava(()=>db.doc('pedidos/'+F.id).delete(),'Pedido apagado');fechaSheet()}break
   case 'status':await mudaStatus(ped(),t.dataset.st);break
   case 'novoGasto':formGasto();break
   case 'salvaGasto':{const valor=parseFloat(($('#fgVal').value||'').replace(',','.'));if(!(valor>0)){alert('Coloque o valor.');return}
     const ok=await grava(()=>db.collection('gastos').add({categoria:$('#fgCat').value,descricao:$('#fgDesc').value.trim(),valor,data:$('#fgDia').value||dia(),criadoEm:new Date().toISOString()}),'Gasto lançado');if(ok)fechaSheet();break}
   case 'apagaGasto':if(confirm('Apagar este gasto?'))grava(()=>db.doc('gastos/'+id).delete(),'Apagado');break
   case 'salvaCfg':{const precos={},taxas={};KITS.forEach(k=>precos[k.id]=parseFloat($('#cfP_'+k.id).value)||k.preco);ENTREGAS.filter(e=>e.taxa).forEach(e=>taxas[e.id]=parseFloat($('#cfT_'+e.id).value)||0)
     const ori=$('#cfOri').value.split(',').map(s=>s.trim()).filter(Boolean)
     grava(()=>db.doc('config/geral').set({...S.config,pix:$('#cfPix').value.trim(),endereco:$('#cfEnd').value.trim(),origens:ori,precos,taxas}),'Ajustes salvos');break}
   case 'est':{const k=t.dataset.k;grava(()=>db.doc('estoque/'+k).update({qtd:Math.max(0,(Number(S.estoque[k]?.qtd)||0)+(+t.dataset.d))}));break}
   case 'estCria':{const k=t.dataset.k;const q=prompt('Quantos '+ESTOQUE_NOMES[k]+' vocês têm agora?','0');if(q===null)return;const mi=prompt('Avisar quando chegar em quantos?','10');grava(()=>db.doc('estoque/'+k).set({nome:ESTOQUE_NOMES[k],qtd:parseInt(q)||0,minimo:parseInt(mi)||0}),'Cadastrado');break}
  }
})
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.act==='prodDia'){S.prodDia=t.value;render()}if(t.dataset.act==='mes'){S.mes=t.value;render()}})
$('#sheet').addEventListener('click',ev=>{if(ev.target.id==='sheet')fechaSheet()})
iniciar()
</script>

</body></html>
