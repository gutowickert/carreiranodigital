<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141826">
<title>Teu painel · Maia</title>
<!-- Maia: o painel do DONO (07/11). Abre pelo link mágico (?t=...). A página troca o link por um cookie httpOnly e tira o
     token da barra de endereço. Tudo vem de /api/maia/painel, só do negócio do link. Sem fonte nem script de fora. -->
<style>
:root{--bg:#f5f0e6;--card:#fff;--card2:#fbf8f2;--tx:#141826;--mu:#635f57;--ln:#e6dfd1;--coral:#ff7a59;--coral-tx:#b6431f;--coral-bg:#fff0ea;
  --verde:#11865a;--verde-bg:#e3f5ec;--verm:#c62a3c;--verm-bg:#fdecee;--amar:#94600a;--amar-bg:#fdf3dc;--azul:#2b54c7;--azul-bg:#e8eefc;
  --hero:#141826;--hero-tx:#f5f0e6;--hero-mu:#b8b3a8;--chat:#efe7da;--bolha-eu:#dcf3df;--sombra:0 1px 2px rgba(20,24,38,.06),0 4px 14px rgba(20,24,38,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131e;--card:#1b2033;--card2:#171b2b;--tx:#f5f0e6;--mu:#aaa59a;--ln:#2c3350;--coral-tx:#ff9b80;--coral-bg:#3a2420;
  --verde:#3ddc97;--verde-bg:#16362b;--verm:#ff7d8c;--verm-bg:#3d1d24;--amar:#f5c065;--amar-bg:#3a2f17;--azul:#93acff;--azul-bg:#1f2a4d;--hero:#1b2033;--chat:#141826;--bolha-eu:#1f4a3a;--sombra:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131e;--card:#1b2033;--card2:#171b2b;--tx:#f5f0e6;--mu:#aaa59a;--ln:#2c3350;--coral-tx:#ff9b80;--coral-bg:#3a2420;
  --verde:#3ddc97;--verde-bg:#16362b;--verm:#ff7d8c;--verm-bg:#3d1d24;--amar:#f5c065;--amar-bg:#3a2f17;--azul:#93acff;--azul-bg:#1f2a4d;--hero:#1b2033;--chat:#141826;--bolha-eu:#1f4a3a;--sombra:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
#app{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* topo */
.hero{background:var(--hero);color:var(--hero-tx);padding:18px 0 22px}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--coral);color:#141826;display:grid;place-items:center;font-weight:800;font-size:18px}
.marca b{font-size:16px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.2}
.marca small{color:var(--hero-mu);font-size:13px;display:block;line-height:1.2}
.ola{font-size:24px;line-height:1.2;margin:18px 0 4px;font-weight:800;letter-spacing:-.02em}
.ola-sub{color:var(--hero-mu);margin:0;font-size:14px}
.per{display:flex;gap:6px;background:rgba(245,240,230,.08);padding:4px;border-radius:12px;margin-top:16px}
.per button{flex:1;border:0;background:transparent;color:var(--hero-mu);padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.per button[aria-pressed="true"]{background:var(--hero-tx);color:#141826}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:rgba(245,240,230,.07);border:1px solid rgba(245,240,230,.10);border-radius:14px;padding:12px 13px;min-width:0}
.kpi .r{font-size:12.5px;color:var(--hero-mu);display:block}
.kpi .n{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .p{font-size:12.5px;color:var(--hero-mu);display:block}
.kpi.grande{grid-column:span 2;background:var(--coral);border-color:var(--coral);color:#141826}
.kpi.grande .r,.kpi.grande .p{color:#3a2017}
.kpi.grande .n{font-size:30px}
/* abas */
.abas{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.abas .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.abas .wrap::-webkit-scrollbar{display:none}
.abas a{flex:0 0 auto;text-decoration:none;padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mu);border:1px solid var(--ln);background:var(--card);white-space:nowrap}
.abas a[aria-current="page"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.abas a .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--coral);color:#141826;font-size:11.5px;line-height:18px;text-align:center}
main{padding-top:16px;padding-bottom:28px}
section[hidden]{display:none}
h2{font-size:18px;margin:22px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
h2 small{font-weight:600;color:var(--mu);font-size:13px;margin-left:6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sombra)}
.pad{padding:14px 16px}
.mu{color:var(--mu)}.peq{font-size:13px}
.lista{list-style:none;margin:0;padding:0}
.lista>li{padding:12px 16px;border-top:1px solid var(--ln);display:flex;gap:12px;align-items:flex-start}
.lista>li:first-child{border-top:0}
.lista>li.toca{cursor:pointer}
.av{flex:0 0 36px;height:36px;border-radius:50%;background:var(--azul-bg);color:var(--azul);display:grid;place-items:center;font-weight:800;font-size:15px}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15px;line-height:1.3}
.mid .l2{color:var(--mu);font-size:13.5px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dir{flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-verde{background:var(--verde-bg);color:var(--verde)}.c-verm{background:var(--verm-bg);color:var(--verm)}.c-amar{background:var(--amar-bg);color:var(--amar)}
.c-azul{background:var(--azul-bg);color:var(--azul)}.c-coral{background:var(--coral-bg);color:var(--coral-tx)}.c-cinza{background:var(--card2);color:var(--mu);border:1px solid var(--ln)}
.espera{border-left:4px solid var(--coral)}
.espera li .ic{flex:0 0 28px;height:28px;border-radius:8px;background:var(--coral-bg);color:var(--coral-tx);display:grid;place-items:center;font-size:15px}
.vazio{padding:22px 16px;text-align:center;color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.ruim{color:var(--verm)}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* funil */
.funil{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:thin}
.col{flex:0 0 76%;max-width:300px;scroll-snap-align:start;background:var(--card2);border:1px solid var(--ln);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col-cab{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:800;font-size:14px}
.col-cab .t{display:flex;align-items:center;gap:7px}
.col-cab i{width:9px;height:9px;border-radius:50%;display:inline-block}
.col-cab span.mu{font-weight:600;font-size:12.5px}
.lc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 11px;cursor:pointer;text-align:left;width:100%}
.lc b{display:block;font-size:14.5px}
.lc .v{font-weight:800;font-size:13.5px}
.lc .pa{display:block;color:var(--mu);font-size:12.5px;margin-top:3px;line-height:1.35}
.lc .pa.quente{color:var(--coral-tx);font-weight:700}
/* retomadas */
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini div{min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 6px;text-align:center}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini span{font-size:11.5px;color:var(--mu);line-height:1.2;display:block}
.mini .alerta{border-color:var(--verm);background:var(--verm-bg)}
.mini .alerta b,.mini .alerta span{color:var(--verm)}
li.atrasada{background:var(--verm-bg)}
/* conversa */
.chat-top{position:sticky;top:0;z-index:6;background:var(--hero);color:var(--hero-tx);display:flex;align-items:center;gap:10px;padding:10px 12px}
.chat-top button{border:0;background:transparent;color:var(--hero-tx);font-size:22px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px}
.chat-top b{display:block;font-size:15.5px}.chat-top small{color:var(--hero-mu);font-size:12.5px}
.chat{background:var(--chat);min-height:calc(100vh - 56px);padding:12px 10px 28px;display:flex;flex-direction:column;gap:4px}
.dia{align-self:center;background:var(--card);color:var(--mu);font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;margin:8px 0 4px;box-shadow:var(--sombra)}
.bol{max-width:82%;padding:7px 10px 5px;border-radius:10px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bol.cli{align-self:flex-start;background:var(--card);border-top-left-radius:3px}
.bol.eu{align-self:flex-end;background:var(--bolha-eu);border-top-right-radius:3px}
.bol .quem{display:block;font-size:12px;font-weight:800;color:var(--coral-tx)}
.bol .quem.dono{color:var(--azul)}
.bol .h{display:block;text-align:right;font-size:11px;color:var(--mu);margin-top:2px}
/* anúncios */
.anuncio{overflow:hidden}
.anuncio img,.anuncio video{display:block;width:100%;max-height:460px;object-fit:cover;background:var(--card2)}
.anuncio .corpo{padding:12px 14px}
.anuncio .g{font-weight:800;font-size:15.5px;line-height:1.3}
.anuncio .tx{color:var(--mu);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.grade{display:grid;gap:12px}
@media (min-width:640px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}.col{flex-basis:240px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi.grande{grid-column:span 2}}
/* folha de baixo (ações) */
.veu{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.folha h3{margin:0 0 2px;font-size:19px}
.campo{display:block;margin-top:12px}
.campo span{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:4px}
.campo input,.campo textarea,.campo select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card2)}
.campo textarea{min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:92vw}
/* rodapé */
.rodape{padding:6px 0 26px;text-align:center}
.wa{display:flex;align-items:center;justify-content:center;gap:9px;background:#25D366;color:#0b2e17;font-weight:800;font-size:16px;text-decoration:none;border-radius:14px;padding:15px}
.wa svg{width:22px;height:22px}
.rodape p{margin:10px 0 0;color:var(--mu);font-size:12.5px}
.esq{background:linear-gradient(90deg,var(--ln),var(--card2),var(--ln));background-size:200% 100%;animation:esq 1.2s infinite;border-radius:10px}
@keyframes esq{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.esq{animation:none}}
.porta{max-width:460px;margin:0 auto;padding:60px 20px;text-align:center}
.porta h1{font-size:24px;margin:18px 0 8px}
.porta p{color:var(--mu)}
.motivos li{display:flex;justify-content:space-between;gap:10px}
.barra{height:6px;border-radius:6px;background:var(--ln);margin-top:6px;overflow:hidden}.barra i{display:block;height:100%;background:var(--verm)}
</style>
</head>
<body>
<div id="app"><div class="porta"><div class="logo" style="margin:0 auto">M</div><h1>Abrindo o teu painel…</h1><p>Só um instante.</p></div></div>
<script>
(function(){
'use strict';
var API='/api/maia/painel', S={dados:null,per:'semana',aba:'resumo',conversa:null};
var NUM_MAIA='5551993767137';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,e){return(e||document).querySelector(s);}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s));}
function real(v){if(v==null||v==='')return '—';var n=Number(v);if(isNaN(n))return '—';return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:n%1?2:0});}
function int(v){return v==null?'—':Number(v).toLocaleString('pt-BR');}
function pct(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';}
function minutos(v){if(v==null)return '—';if(v<1)return '< 1 min';if(v<60)return Math.round(v)+' min';return (Math.round(v/6)/10).toLocaleString('pt-BR')+' h';}
function dataC(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function hora(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function quando(iso){if(!iso)return '';var d=new Date(iso),h=new Date(),o=new Date(Date.now()-864e5),a=new Date(Date.now()+864e5);
  var mesmo=function(x,y){return x.toDateString()===y.toDateString();};
  if(mesmo(d,h))return 'hoje '+hora(iso);if(mesmo(d,o))return 'ontem '+hora(iso);if(mesmo(d,a))return 'amanhã '+hora(iso);
  return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','')+' '+hora(iso);}
function inicial(s){s=String(s||'?').trim();return esc((s[0]||'?').toUpperCase());}
function fone(t){t=String(t||'').replace(/\D/g,'');if(/^55\d{10,11}$/.test(t)){var d=t.slice(4);return '('+t.slice(2,4)+') '+d.slice(0,d.length-4)+'-'+d.slice(-4);}return t;}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function wa(texto){return 'https://wa.me/'+(S.dados&&S.dados.whatsapp_maia||NUM_MAIA)+(texto?'?text='+encodeURIComponent(texto):'');}
var ICWA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';

function api(q,corpo){
  var o=corpo?{method:'POST',headers:{'content-type':'application/json','x-maia-painel':'1'},body:JSON.stringify(corpo),credentials:'same-origin'}:{credentials:'same-origin'};
  return fetch(API+(q?'?'+q:''),o).then(function(r){return r.json().catch(function(){return{};}).then(function(j){if(!r.ok){var e=new Error(j.erro||('erro '+r.status));e.status=r.status;throw e;}return j;});});
}
function porta(titulo,frase){
  $('#app').innerHTML='<div class="porta"><div class="logo" style="margin:0 auto">M</div><h1>'+esc(titulo)+'</h1><p>'+esc(frase)+'</p>'+
    '<a class="wa" style="margin-top:22px" href="'+wa('Maia, me manda o link do meu painel')+'" target="_blank" rel="noopener">'+ICWA+'Pedir um link novo pra Maia</a></div>';
}

// 1) entra: troca o ?t= por um cookie httpOnly e tira o token da barra de endereço (e do histórico)
function entrar(){
  var u=new URL(location.href), t=u.searchParams.get('t');
  if(!t) return Promise.resolve();
  history.replaceState(null,'',u.pathname+u.hash);
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({acao:'entrar',t:t}),credentials:'same-origin'}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.erro||'link inválido');e.status=r.status;throw e;}});});
}
function carrega(){
  return api('acao=tudo').then(function(d){S.dados=d;if(!$('#topo'))esqueleto();pinta();});
}
function lerHash(){
  var h=location.hash.replace(/^#/,''), m=h.match(/^conversa=([\w-]+)$/);
  if(m){S.conversa=m[1];abreConversa(m[1]);return;}
  S.conversa=null;
  var abas=['resumo','funil','retomadas','conversas','anuncios','vendas','avisos'];
  S.aba=abas.indexOf(h)>=0?h:'resumo';
  if(!$('#topo')){esqueleto();}
  pinta();
  // trocou de aba: a seção começa no alto da tela (o topo com os números fica em cima, é só voltar)
  var ab=document.querySelector('.abas');if(S.aba!=='resumo'&&ab&&S.dados)window.scrollTo(0,ab.offsetTop);
}

function esqueleto(){
  $('#app').innerHTML=
   '<header class="hero" id="topo"><div class="wrap"><div class="marca"><span class="logo" aria-hidden="true">M</span><span><b id="nome-neg">…</b><small>teu painel da Maia</small></span></div>'+
   '<p class="ola" id="ola">Olá!</p><p class="ola-sub" id="ola-sub">Tudo que a Maia fez pelo teu negócio.</p>'+
   '<div class="per" role="group" aria-label="Período"><button type="button" data-per="hoje">Hoje</button><button type="button" data-per="semana">7 dias</button><button type="button" data-per="mes">Este mês</button></div>'+
   '<div class="kpis" id="kpis"></div></div></header>'+
   '<nav class="abas" aria-label="Partes do painel"><div class="wrap" id="abas"></div></nav>'+
   '<main class="wrap" id="corpo"></main>'+
   '<footer class="wrap rodape"><a class="wa" id="wa" href="#" target="_blank" rel="noopener">'+ICWA+'Fale com a Maia no WhatsApp</a><p>Tu gere tudo pelo WhatsApp. Aqui é pra acompanhar. Esse link é só teu: não repassa.</p></footer>';
  $$('.per button').forEach(function(b){b.onclick=function(){S.per=b.dataset.per;pintaTopo();};});
}

function pinta(){
  if(!S.dados||S.conversa)return;
  if(!$('#topo'))esqueleto();
  pintaTopo();pintaAbas();
  var c=$('#corpo'),f={resumo:secResumo,funil:secFunil,retomadas:secRetomadas,conversas:secConversas,anuncios:secAnuncios,vendas:secVendas,avisos:secAvisos}[S.aba];
  c.innerHTML=f();liga(c);
  $('#wa').href=wa();
}
function pintaTopo(){
  var d=S.dados,n=d.negocio,p=d.periodos[S.per]||{};
  $('#nome-neg').textContent=n.nome||'';
  $('#ola').textContent='Olá'+(n.dono?', '+n.dono:'')+'!';
  var rot={hoje:'hoje',semana:'nos últimos 7 dias',mes:'este mês'}[S.per];
  $('#ola-sub').textContent='O que a Maia fez pelo teu negócio '+rot+'.';

  $('#app').innerHTML='<div class="chat-top"><button type="button" id="volta" aria-label="Voltar">←</button><span class="av" style="flex:0 0 36px">'+inicial(c&&(c.nome||c.telefone))+'</span><span><b>'+esc(c?(c.nome||fone(c.telefone)):'Conversa')+'</b><small>'+(c?esc(fone(c.telefone))+' · '+(ST_CV[c.status]||ST_CV.maia)[0]:'')+'</small></span></div><div class="chat" id="chat"><div class="esq" style="height:40px;width:60%"></div><div class="esq" style="height:40px;width:50%;align-self:flex-end"></div></div>';
  $('#volta').onclick=function(){location.hash='conversas';};
  api('acao=conversa&id='+encodeURIComponent(id)).then(function(r){
    var h='',dia='';
    r.msgs.forEach(function(m){var d=new Date(m.criado_em).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});if(d!==dia){dia=d;h+='<span class="dia">'+esc(d)+'</span>';}
      var cli=m.autor==='cliente';
      h+='<div class="bol '+(cli?'cli':'eu')+'">'+(cli?'':'<span class="quem'+(m.autor==='dono'?' dono':'')+'">'+(m.autor==='dono'?'Tu':'Maia')+'</span>')+esc(m.texto||'('+(m.tipo||'mensagem')+')')+'<span class="h">'+hora(m.criado_em)+'</span></div>';});
    $('#chat').innerHTML=h||'<div class="vazio">Sem mensagens.</div>';
  }).catch(function(e){$('#chat').innerHTML='<div class="vazio">'+esc(e.message)+'</div>';});
}

window.addEventListener('hashchange',lerHash);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.dados&&!S.conversa)carrega().catch(function(){});});
entrar().then(carrega).then(lerHash).catch(function(e){
  if(e.status===401) porta('Esse link venceu','O link do painel vale 30 dias e é só teu. Pede um novo pra Maia: é só escrever "meu painel" no WhatsApp.');
  else if(e.status===429) porta('Muitas tentativas','Espera 15 minutos e abre o link de novo.');
  else porta('Não deu pra abrir agora',(e.message||'')+'. Tenta de novo em um minuto.');
});
})();
</script>
