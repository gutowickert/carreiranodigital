<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f5fc">
<title>Teu painel · Maia</title>
<link rel="icon" href="/maia/img/maia-avatar.webp">
<!-- Maia: o painel do DONO (07/11; visual novo 08/11: fundo claro, a Maia em pessoa, retorno do anúncio como número-herói).
     Abre pelo link mágico (?t=...). A página troca o link por um cookie httpOnly e tira o token da barra de endereço.
     Tudo vem de /api/maia/painel, só do negócio do link. Sem script de fora; as fontes são da própria escola (/maia/fontes).
     Paleta e regras: docs/maia-visual/PALETA.md. Escuro só no botão (nunca é o padrão). -->
<script>(function(){try{if(localStorage.getItem('maia_dono_tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;src:url(/maia/fontes/manrope-latin.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:300 800;font-stretch:75% 100%;font-display:swap;src:url(/maia/fontes/bricolage-latin.woff2) format('woff2')}
:root{
  --bg:#f7f5fc;--surface:#fff;--surface-2:#f3f0fa;--border:#ebe6f5;--border-strong:#dcd5ec;
  --text:#1b1530;--text-2:#423a5c;--text-muted:#6b6485;--text-faint:#77708f;
  --accent:#7c3aed;--accent-2:#8b5cf6;--accent-tx:#6d28d9;--accent-bg:#f1ebfe;--accent-line:#c4b5fd;
  --hero-a:#f4eeff;--hero-b:#ffffff;
  --green:#15803d;--green-bg:#dcfce7;--amber:#b45309;--amber-bg:#fef3c7;--red:#b91c1c;--red-bg:#fee2e2;--blue:#1d4ed8;--blue-bg:#dbeafe;
  --chat:#f3f0fa;--bolha-eu:#ede5ff;--sombra:0 1px 2px rgba(27,21,48,.04),0 4px 16px rgba(27,21,48,.05);--sombra-alta:0 10px 30px rgba(76,29,149,.10);
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0f0c17;--surface:#171320;--surface-2:#1f1a2b;--border:#261f36;--border-strong:#372e4c;
  --text:#f4f1fb;--text-2:#c9c2da;--text-muted:#9a93ae;--text-faint:#8a83a0;
  --accent:#8b5cf6;--accent-2:#a78bfa;--accent-tx:#c4b5fd;--accent-bg:#2a1b4d;--accent-line:#5b3fa6;
  --hero-a:#1f1733;--hero-b:#171320;
  --green:#4ade80;--green-bg:#0d2e20;--amber:#fbbf24;--amber-bg:#3a2a0a;--red:#fb7185;--red-bg:#3b1520;--blue:#93c5fd;--blue-bg:#14243f;
  --chat:#130f1c;--bolha-eu:#2a1b4d;--sombra:none;--sombra-alta:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
#app{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num,.n,.k-num,.heroi-n{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3,.k-num,.heroi-n,.ola{font-family:'Bricolage Grotesque','Manrope',sans-serif;font-variation-settings:'opsz' 48,'wdth' 90}
:focus{outline:none}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px;border-radius:10px}

/* barra de cima */
.barra-top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.barra-top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.quem-top{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.foto{position:relative;flex:none;border-radius:50%;display:block}
.foto img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.foto.on::after{content:'';position:absolute;right:0;bottom:0;width:28%;height:28%;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px var(--surface)}
.quem-top .foto{width:36px;height:36px}
.quem-top b{display:block;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem-top small{display:block;color:var(--text-muted);font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;flex:none;padding:0}
.icbtn svg{width:18px;height:18px}

/* abertura: a Maia falando + o período */
.abre{padding-top:18px;padding-bottom:4px}
.fala{display:flex;gap:12px;align-items:flex-end}
.fala .foto{width:56px;height:56px;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--accent-line)}
.balao{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 18px 6px;padding:11px 14px;box-shadow:var(--sombra);min-width:0}
.ola{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0}
.ola-sub{color:var(--text-muted);margin:2px 0 0;font-size:14px}
.per{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);padding:4px;border-radius:12px;margin-top:16px}
.per button{flex:1;border:0;background:transparent;color:var(--text-muted);padding:8px 6px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.per button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(27,21,48,.08),0 0 0 1px var(--border)}

/* o número-herói: retorno do anúncio */
.heroi{margin-top:14px;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b) 70%);border:1px solid var(--border);box-shadow:var(--sombra-alta);position:relative;overflow:hidden}
.heroi-rot{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-tx)}
.heroi-n{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:8px;font-variation-settings:'opsz' 96,'wdth' 82;color:var(--text)}
.heroi-n small{font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:var(--text-muted);letter-spacing:0;margin-left:6px}
.heroi-frase{font-size:15px;color:var(--text-2);margin:4px 0 0;font-weight:600}
.heroi-frase b{color:var(--accent-tx)}
.fluxo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.fluxo span{display:block;font-size:12px;color:var(--text-muted);font-weight:700}
.fluxo b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fluxo .seta{color:var(--accent);font-size:20px;font-weight:800}
.fluxo .vende b{color:var(--green)}
.heroi-pe{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.heroi-graf{margin-top:12px}
.heroi-graf .leg{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-top:4px}
.heroi-graf .leg i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--accent)}
.heroi-graf .leg i.g{background:var(--text-faint)}
.nota{font-size:12.5px;color:var(--text-muted);margin:10px 0 0;line-height:1.45}

/* cartões de número (KPI) com tendência e mini-gráfico */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 13px 10px;min-width:0;box-shadow:var(--sombra);display:flex;flex-direction:column}
.k-rot{font-size:12.5px;color:var(--text-muted);font-weight:700;display:block}
.k-num{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:'opsz' 96,'wdth' 86}
.k-pe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:2px;min-height:20px}
.spark{display:block;width:100%;height:30px;margin-top:6px;overflow:visible}
.tend{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.tend.sobe{background:var(--green-bg);color:var(--green)}.tend.desce{background:var(--red-bg);color:var(--red)}.tend.igual{background:var(--surface-2);color:var(--text-muted)}
.comp{font-size:11.5px;color:var(--text-faint)}

/* abas */
.abas{position:sticky;top:58px;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-top:16px;border-bottom:1px solid var(--border)}
.abas .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.abas .wrap::-webkit-scrollbar{display:none}
.abas a{flex:0 0 auto;text-decoration:none;padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--text-muted);border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.abas a[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.abas a .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:11.5px;line-height:18px;text-align:center}
.abas a[aria-current="page"] .b{background:#fff;color:var(--accent-tx)}
main{padding-top:14px;padding-bottom:28px}
h2{font-size:18px;font-weight:700;margin:24px 0 10px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2:first-child{margin-top:4px}
h2 small{font-family:'Manrope',sans-serif;font-weight:600;color:var(--text-muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sombra)}
.pad{padding:14px 16px}
.mu{color:var(--text-muted)}.peq{font-size:13px}
.lista{list-style:none;margin:0;padding:0}
.lista>li{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.lista>li:first-child{border-top:0}
.lista>li.toca{cursor:pointer}
.lista>li.toca:hover{background:var(--surface-2)}
.av{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--accent-bg);color:var(--accent-tx)}
.av.t1{background:#e0ecff;color:#1d4ed8}.av.t2{background:#dcfce7;color:#15803d}.av.t3{background:#fef3c7;color:#92400e}.av.t4{background:#fce7f3;color:#be185d}.av.t5{background:var(--accent-bg);color:var(--accent-tx)}
:root[data-theme="dark"] .av.t1{background:#14243f;color:#93c5fd}:root[data-theme="dark"] .av.t2{background:#0d2e20;color:#4ade80}:root[data-theme="dark"] .av.t3{background:#3a2a0a;color:#fbbf24}:root[data-theme="dark"] .av.t4{background:#3b1530;color:#f9a8d4}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15px;line-height:1.3}
.mid .l2{color:var(--text-muted);font-size:13.5px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dir{flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip img{width:16px;height:16px;border-radius:50%;margin-left:-5px}
.c-verde{background:var(--green-bg);color:var(--green)}.c-verm{background:var(--red-bg);color:var(--red)}.c-amar{background:var(--amber-bg);color:var(--amber)}
.c-azul{background:var(--blue-bg);color:var(--blue)}.c-coral,.c-roxo{background:var(--accent-bg);color:var(--accent-tx)}.c-cinza{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
.espera li .ic{flex:0 0 34px;height:34px;border-radius:10px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center;font-size:16px}
.espera{border-left:4px solid var(--amber)}
.vazio{padding:22px 16px;text-align:center;color:var(--text-muted);font-size:14px}
.vazio.maia{display:flex;gap:12px;align-items:center;text-align:left}
.vazio.maia img{width:40px;height:40px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:42px}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
:root[data-theme="dark"] .btn.ok{color:#06281a}
.btn.ruim{color:var(--red)}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* funil em barras */
.fbar{display:grid;gap:9px}
.fbar .l{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.fbar .l>span{color:var(--text-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .tr{height:22px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.fbar .tr i{display:block;height:100%;border-radius:7px;background:var(--accent-2)}
.fbar .l b{font-size:13.5px;text-align:right;white-space:nowrap}
.fbar .l b small{font-weight:600;color:var(--text-muted);margin-left:4px}
/* funil em colunas */
.funil{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:thin}
.col{flex:0 0 76%;max-width:300px;scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col-cab{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:800;font-size:14px}
.col-cab .t{display:flex;align-items:center;gap:7px}
.col-cab i{width:9px;height:9px;border-radius:50%;display:inline-block}
.col-cab span.mu{font-weight:600;font-size:12.5px}
.lc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 11px;cursor:pointer;text-align:left;width:100%}
.lc:hover{border-color:var(--accent-line)}
.lc b{display:block;font-size:14.5px}
.lc .v{font-weight:800;font-size:13.5px}
.lc .pa{display:block;color:var(--text-muted);font-size:12.5px;margin-top:3px;line-height:1.35}
.lc .pa.quente{color:var(--amber);font-weight:700}
/* retomadas: números e linha do tempo */
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini div{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 6px;text-align:center}
.mini b{display:block;font-size:21px;line-height:1.2;font-family:'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.mini span{font-size:11.5px;color:var(--text-muted);line-height:1.2;display:block}
.mini .alerta{border-color:var(--red);background:var(--red-bg)}
.mini .alerta b,.mini .alerta span{color:var(--red)}
.tempo{list-style:none;margin:0;padding:6px 0;position:relative}
.tempo::before{content:'';position:absolute;left:31px;top:18px;bottom:18px;width:2px;background:var(--border)}
.tempo li{display:flex;gap:12px;align-items:flex-start;padding:9px 16px;position:relative;cursor:pointer}
.tempo li:hover{background:var(--surface-2)}
.tempo .pt{flex:0 0 32px;display:grid;place-items:center;padding-top:4px}
.tempo .pt i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent-2);position:relative;z-index:1}
.tempo li.atrasada .pt i{border-color:var(--red)}
.tempo li.feita .pt i{background:var(--text-faint);border-color:var(--text-faint)}
.tempo li.respondeu .pt i{background:var(--green);border-color:var(--green)}
.tempo .q{font-size:12px;font-weight:800;color:var(--text-muted);display:block}
.tempo li.atrasada .q{color:var(--red)}
/* conversa */
.chat-top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 12px}
.chat-top button{border:0;background:transparent;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px;color:var(--text)}
.chat-top b{display:block;font-size:15.5px}.chat-top small{color:var(--text-muted);font-size:12.5px}
.chat{background:var(--chat);min-height:calc(100vh - 60px);padding:12px 10px 28px;display:flex;flex-direction:column;gap:4px}
.dia{align-self:center;background:var(--surface);color:var(--text-muted);font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;margin:8px 0 4px;box-shadow:var(--sombra)}
.bol{max-width:82%;padding:7px 10px 5px;border-radius:12px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(27,21,48,.05)}
.bol.cli{align-self:flex-start;background:var(--surface);border-top-left-radius:4px}
.bol.eu{align-self:flex-end;background:var(--bolha-eu);border-top-right-radius:4px}
.bol .quem{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--accent-tx)}
.bol .quem img{width:16px;height:16px;border-radius:50%}
.bol .quem.dono{color:var(--blue)}
.bol .h{display:block;text-align:right;font-size:11px;color:var(--text-muted);margin-top:2px}
/* anúncios */
.anuncio{overflow:hidden}
.anuncio img,.anuncio video{display:block;width:100%;max-height:460px;object-fit:cover;background:var(--surface-2)}
.anuncio .corpo{padding:12px 14px}
.anuncio .g{font-weight:800;font-size:15.5px;line-height:1.3}
.anuncio .tx{color:var(--text-muted);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.mini-an{flex:0 0 56px;height:70px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--text-faint);font-size:11px}
.mini-an img,.mini-an video{width:100%;height:100%;object-fit:cover;display:block}
.grade{display:grid;gap:12px}
.camp-n{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;font-size:13px;color:var(--text-muted)}
.camp-n b{color:var(--text);font-size:15px;font-family:'Bricolage Grotesque',sans-serif}
/* folha de baixo (ações) */
.veu{position:fixed;inset:0;background:rgba(27,21,48,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.folha h3{margin:0 0 2px;font-size:20px}
.campo{display:block;margin-top:12px}
.campo span{display:block;font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.campo input,.campo textarea,.campo select{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2)}
.campo textarea{min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:92vw}
/* rodapé */
.rodape{padding-top:6px;padding-bottom:26px;text-align:center}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#0b2e17;font-weight:800;font-size:16px;text-decoration:none;border-radius:14px;padding:12px 15px}
.wa svg{width:22px;height:22px}
.wa img{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.rodape p{margin:10px 0 0;color:var(--text-muted);font-size:12.5px}
/* carregando (skeleton) */
.esq{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:esq 1.2s infinite;border-radius:10px}
@keyframes esq{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.esq{animation:none}}
.porta{max-width:440px;margin:0 auto;padding:56px 20px;text-align:center}
.porta .foto{width:96px;height:96px;margin:0 auto;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--accent-line)}
.porta h1{font-size:25px;margin:18px 0 8px;letter-spacing:-.02em;line-height:1.2}
.porta p{color:var(--text-muted)}
.barra{height:6px;border-radius:6px;background:var(--surface-2);margin-top:6px;overflow:hidden}.barra i{display:block;height:100%;background:var(--red)}
/* computador: duas colunas no topo */
@media (min-width:860px){
  .topo-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
  .heroi{margin-top:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
  .grade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col{flex-basis:230px}
  .duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .duas>div>h2:first-child{margin-top:4px}
  .heroi-n{font-size:56px}
}

<body>
<div id="app">
  <div class="barra-top"><div class="wrap"><span class="quem-top"><span class="foto on"><img src="/maia/img/maia-avatar.webp" alt="" width="36" height="36"></span><span><b>Maia</b><small>abrindo o teu painel…</small></span></span></div></div>
  <div class="wrap abre" aria-busy="true" aria-label="Carregando">
    <div class="fala"><span class="foto"><img src="/maia/img/maia-avatar.webp" alt="" width="56" height="56"></span><div class="balao" style="flex:1"><div class="esq" style="height:20px;width:70%"></div><div class="esq" style="height:13px;width:45%;margin-top:8px"></div></div></div>
    <div class="esq" style="height:44px;margin-top:16px;border-radius:12px"></div>
    <div class="esq" style="height:210px;margin-top:14px;border-radius:22px"></div>
    <div class="kpis"><div class="esq" style="height:112px;border-radius:16px"></div><div class="esq" style="height:112px;border-radius:16px"></div><div class="esq" style="height:112px;border-radius:16px"></div><div class="esq" style="height:112px;border-radius:16px"></div></div>
  </div>
</div>
<script>
(function(){
'use strict';
var API='/api/maia/painel', S={dados:null,per:'semana',aba:'resumo',conversa:null};
var NUM_MAIA='5551993767137', FOTO='/maia/img/maia-avatar.webp';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,e){return(e||document).querySelector(s);}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s));}
function real(v){if(v==null||v==='')return '—';var n=Number(v);if(isNaN(n))return '—';return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:n%1?2:0});}
function real2(v){var n=Number(v)||0;return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});}
function int(v){return v==null?'—':Number(v).toLocaleString('pt-BR');}
function pct(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';}
function vezes(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'×';}
function minutos(v){if(v==null)return '—';if(v<1)return '< 1 min';if(v<60)return Math.round(v)+' min';return (Math.round(v/6)/10).toLocaleString('pt-BR')+' h';}
function dataC(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function hora(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function quando(iso){if(!iso)return '';var d=new Date(iso),h=new Date(),o=new Date(Date.now()-864e5),a=new Date(Date.now()+864e5);
  var mesmo=function(x,y){return x.toDateString()===y.toDateString();};
  if(mesmo(d,h))return 'hoje '+hora(iso);if(mesmo(d,o))return 'ontem '+hora(iso);if(mesmo(d,a))return 'amanhã '+hora(iso);
  return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','')+' '+hora(iso);}
function inicial(s){s=String(s||'?').trim();return esc((s[0]||'?').toUpperCase());}
function tom(s){s=String(s||'');var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 't'+(1+h%5);}
function av(nome,chave){return '<span class="av '+tom(chave||nome)+'" aria-hidden="true">'+inicial(nome)+'</span>';}
function fone(t){t=String(t||'').replace(/\D/g,'');if(/^55\d{10,11}$/.test(t)){var d=t.slice(4);return '('+t.slice(2,4)+') '+d.slice(0,d.length-4)+'-'+d.slice(-4);}return t;}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function wa(texto){return 'https://wa.me/'+(S.dados&&S.dados.whatsapp_maia||NUM_MAIA)+(texto?'?text='+encodeURIComponent(texto):'');}
function foto(px,on){return '<span class="foto'+(on?' on':'')+'" style="width:'+px+'px;height:'+px+'px"><img src="'+FOTO+'" alt="" width="'+px+'" height="'+px+'"></span>';}
var ICWA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
var IC_LUA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
var IC_SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function escuro(){return document.documentElement.getAttribute('data-theme')==='dark';}
function trocaTema(){var d=!escuro();if(d)document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('maia_dono_tema',d?'dark':'light');}catch(e){}
  var b=$('#b-tema');if(b){b.innerHTML=d?IC_SOL:IC_LUA;b.setAttribute('aria-label',d?'Usar o tema claro':'Usar o tema escuro');}}

// mini-gráfico (linha com área), em SVG puro
function spark(vals,cor,extra){
  vals=(vals||[]).map(function(v){return Number(v)||0;});if(vals.length<2)return '';
  var todos=vals.concat(extra&&extra.vals||[]),mx=Math.max.apply(null,todos.concat([1])),n=vals.length;
  function pts(vs){return vs.map(function(v,i){return [(i/(n-1)*100).toFixed(2),(28-v/mx*24).toFixed(2)];});}
  var p=pts(vals),linha=p.map(function(x,i){return (i?'L':'M')+x[0]+' '+x[1];}).join(' ');
  var h='<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+linha+' L100 30 L0 30 Z" fill="'+cor+'" opacity=".12"/>'+
    '<path d="'+linha+'" fill="none" stroke="'+cor+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
  if(extra){var q=pts(extra.vals).map(function(x,i){return (i?'L':'M')+x[0]+' '+x[1];}).join(' ');h+='<path d="'+q+'" fill="none" stroke="'+extra.cor+'" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>';}
  return h+'</svg>';
}
// tendência contra o período anterior (menor é melhor no custo e no tempo de resposta)
function tend(atual,antes,menorMelhor){
  if(atual==null||antes==null)return '';
  atual=Number(atual);antes=Number(antes);
  if(!antes&&!atual)return '<span class="tend igual" title="igual ao período anterior">= igual</span>';
  if(!antes)return '<span class="tend '+(menorMelhor?'desce':'sobe')+'">novo</span>';
  var d=Math.round((atual-antes)/antes*100);
  if(!d)return '<span class="tend igual">= igual</span>';
  var bom=menorMelhor?d<0:d>0;
  return '<span class="tend '+(bom?'sobe':'desce')+'" title="contra o período anterior">'+(d>0?'↑':'↓')+' '+Math.abs(d)+'%</span>';
}
var JANELA={hoje:7,semana:8,mes:0};
function corte(vals){var n=JANELA[S.per];if(S.per==='mes'){n=new Date().getDate();}return (vals||[]).slice(-Math.max(2,n));}

function api(q,corpo){
  var o=corpo?{method:'POST',headers:{'content-type':'application/json','x-maia-painel':'1'},body:JSON.stringify(corpo),credentials:'same-origin'}:{credentials:'same-origin'};
  return fetch(API+(q?'?'+q:''),o).then(function(r){return r.json().catch(function(){return{};}).then(function(j){if(!r.ok){var e=new Error(j.erro||('erro '+r.status));e.status=r.status;e.motivo=j.motivo||null;throw e;}return j;});});
}
function porta(titulo,frase,botao){
  $('#app').innerHTML='<div class="porta">'+foto(96)+'<h1>'+esc(titulo)+'</h1><p>'+esc(frase)+'</p>'+
    '<a class="wa" style="margin-top:22px" href="'+wa('Maia, me manda o link do meu painel')+'" target="_blank" rel="noopener">'+ICWA+esc(botao||'Pedir um link novo pra Maia')+'</a></div>';
}

// 1) entra: troca o ?t= por um cookie httpOnly e tira o token da barra de endereço (e do histórico)
var TINHA_LINK=false;
function entrar(){
  var u=new URL(location.href), t=u.searchParams.get('t');
  if(!t) return Promise.resolve();
  TINHA_LINK=true;
  history.replaceState(null,'',u.pathname+u.hash);
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({acao:'entrar',t:t}),credentials:'same-origin'}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.erro||'link inválido');e.status=r.status;e.motivo='recusado';throw e;}});});
}
function carrega(){
  return api('acao=tudo').then(function(d){S.dados=d;if(!$('#topo'))esqueleto();pinta();});
}
function lerHash(){
  var h=location.hash.replace(/^#/,''), m=h.match(/^conversa=([\w-]+)$/);
  if(m){S.conversa=m[1];abreConversa(m[1]);return;}
  S.conversa=null;
  var abas=['resumo','funil','retomadas','conversas','anuncios','vendas','avisos'];
  S.aba=abas.indexOf(h)>=0?h:'resumo';
  if(!$('#topo')){esqueleto();}
  pinta();
  // trocou de aba: a seção começa no alto da tela (o topo com os números fica em cima, é só voltar)
  var ab=document.querySelector('.abas');if(S.aba!=='resumo'&&ab&&S.dados)window.scrollTo(0,ab.offsetTop-58);
}

function esqueleto(){
  $('#app').innerHTML=
   '<header class="barra-top"><div class="wrap"><span class="quem-top">'+foto(36,true)+'<span><b id="nome-neg">…</b><small>teu painel da Maia</small></span></span>'+
     '<button type="button" class="icbtn" id="b-tema" aria-label="'+(escuro()?'Usar o tema claro':'Usar o tema escuro')+'">'+(escuro()?IC_SOL:IC_LUA)+'</button></div></header>'+
   '<section class="wrap abre" id="topo"><div class="topo-grid"><div>'+
     '<div class="fala">'+foto(56)+'<div class="balao"><p class="ola" id="ola">Oi!</p><p class="ola-sub" id="ola-sub">Esse é o que eu fiz pelo teu negócio.</p></div></div>'+
     '<div class="per" role="group" aria-label="Período"><button type="button" data-per="hoje">Hoje</button><button type="button" data-per="semana">7 dias</button><button type="button" data-per="mes">Este mês</button></div>'+
     '<div class="heroi" id="heroi"></div></div>'+
     '<div><div class="kpis" id="kpis"></div></div></div></section>'+
   '<nav class="abas" aria-label="Partes do painel"><div class="wrap" id="abas"></div></nav>'+
   '<main class="wrap" id="corpo"></main>'+
   '<footer class="wrap rodape"><a class="wa" id="wa" href="#" target="_blank" rel="noopener"><img src="'+FOTO+'" alt="" width="30" height="30">Fale com a Maia no WhatsApp</a><p>Tu gere tudo pelo WhatsApp. Aqui é pra acompanhar. Esse link é só teu: não repassa.</p></footer>';
  $$('.per button').forEach(function(b){b.onclick=function(){S.per=b.dataset.per;pintaTopo();};});
  $('#b-tema').onclick=trocaTema;
}

function pinta(){
  if(!S.dados||S.conversa)return;
  if(!$('#topo'))esqueleto();
  pintaTopo();pintaAbas();
  var c=$('#corpo'),f={resumo:secResumo,funil:secFunil,retomadas:secRetomadas,conversas:secConversas,anuncios:secAnuncios,vendas:secVendas,avisos:secAvisos}[S.aba];
  c.innerHTML=f();liga(c);
  $('#wa').href=wa();
}
var ROT_PER={hoje:'hoje',semana:'nos últimos 7 dias',mes:'este mês'}, COMP={hoje:'vs ontem até agora',semana:'vs 7 dias antes',mes:'vs mês passado'};
function pintaTopo(){
  var d=S.dados,n=d.negocio,p=d.periodos[S.per]||{},a=p.anterior||{},sr=d.serie||{};
  $('#nome-neg').textContent=n.nome||'';
  $('#ola').textContent='Oi'+(n.dono?', '+n.dono:'')+'!';
  $('#ola-sub').textContent='Esse é o que eu fiz pelo teu negócio '+ROT_PER[S.per]+'.';
  $$('.per button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.per===S.per?'true':'false');});
  $('#heroi').innerHTML=heroi(p,sr);
  var cor='var(--accent-2)',comp='<span class="comp">'+COMP[S.per]+'</span>';
  function k(r,num,pe,t,g){return '<div class="kpi"><span class="k-rot">'+r+'</span><span class="k-num">'+num+'</span><span class="k-pe">'+(t||'')+(t?comp:'')+'</span>'+(pe?'<span class="k-pe">'+pe+'</span>':'')+(g||'')+'</div>';}
  $('#kpis').innerHTML=
    k('Vendas',real(p.receita),int(p.ganhos)+(p.ganhos===1?' venda':' vendas')+(p.ticket_medio?' · ticket '+real(p.ticket_medio):''),tend(p.receita,a.receita),spark(corte(sr.receita),'var(--green)'))+
    k('Contatos novos',int(p.leads_novos),p.em_aberto!=null?int(p.em_aberto)+' em aberto no funil':'',tend(p.leads_novos,a.leads_novos),spark(corte(sr.contatos),cor))+
    k('Conversas da Maia',int(p.conversas_atendidas),'atendidas por ela',tend(p.conversas_atendidas,a.conversas_atendidas),spark(corte(sr.conversas),cor))+
    k('Conversão',pct(p.conversao),'contatos que viraram venda',tend(p.conversao,a.conversao))+
    k('1ª resposta',minutos(p.primeira_resposta_min),'tempo médio da Maia',tend(p.primeira_resposta_min,a.primeira_resposta_min,true))+
    k('Custo por venda',p.custo_por_venda!=null?real(p.custo_por_venda):'—',p.gasto?real(p.gasto)+' em anúncio':'sem anúncio no período',tend(p.custo_por_venda,a.custo_por_venda,true));
}
// o número-herói: a cada R$ 1 investido em anúncio, quanto voltou
function heroi(p,sr){
  var r=p.roi||{},h='';
  if(r.tem_investimento){
    h+='<span class="heroi-rot">Retorno do anúncio · '+esc({hoje:'hoje',semana:'7 dias',mes:'este mês'}[S.per])+'</span>'+
      '<div class="heroi-n" aria-label="A cada 1 real investido em anúncio, voltaram '+esc(real2(r.por_real))+'">'+esc(real2(r.por_real))+'</div>'+
      '<p class="heroi-frase">voltaram a cada <b>R$ 1</b> investido em anúncio</p>'+
      '<div class="fluxo"><div><span>Investiu</span><b>'+real(r.investido)+'</b></div><div class="seta" aria-hidden="true">→</div><div class="vende"><span>Vendeu</span><b>'+real(r.vendido)+'</b></div></div>'+
      '<div class="heroi-pe"><span class="chip c-roxo" title="Retorno sobre o investimento em anúncio">ROAS '+vezes(r.por_real)+'</span>'+
        (r.saldo!=null?'<span class="chip '+(r.saldo>=0?'c-verde':'c-verm')+'">'+(r.saldo>=0?'sobrou ':'faltou ')+real(Math.abs(r.saldo))+' depois do anúncio</span>':'')+
        tend(r.por_real,p.anterior&&p.anterior.retorno)+'</div>'+
      '<div class="heroi-graf">'+spark(corte(sr.receita),'var(--accent-2)',{vals:corte(sr.gasto),cor:'var(--text-faint)'})+'<div class="leg"><span><i></i>vendas por dia</span><span><i class="g"></i>investimento por dia</span></div></div>'+
      '<p class="nota">Conta: vendas do período ÷ investimento em anúncio do período. O investimento é o total de anúncio do teu negócio (Facebook e Instagram) e as vendas são todas as que tu ou a Maia marcaram'+(r.vendido_anuncio?' ('+real(r.vendido_anuncio)+' de clientes que vieram do anúncio)':'')+'.</p>';
  } else {
    h+='<span class="heroi-rot">Vendas que a Maia atendeu · '+esc({hoje:'hoje',semana:'7 dias',mes:'este mês'}[S.per])+'</span>'+
      '<div class="heroi-n">'+real(r.vendido!=null?r.vendido:p.receita)+'<small>'+int(p.ganhos)+(p.ganhos===1?' venda':' vendas')+'</small></div>'+
      '<div class="heroi-graf">'+spark(corte(sr.receita),'var(--accent-2)')+'</div>'+
      '<p class="nota">Ainda não tem investimento em anúncio registrado nesse período, então não dá pra calcular o retorno. Quando a campanha rodar, aqui aparece: <b>a cada R$ 1 investido, quanto voltou</b>.</p>';
  }
  return h;
}
function pintaAbas(){
  var d=S.dados,r=d.retomadas;
  var esperaN=d.esperando.length, anunN=d.anuncios.filter(function(a){return a.status==='com_dono';}).length;
  var it=[['resumo','Resumo',esperaN],['funil','Funil',0],['retomadas','Retomadas',r.atrasadas],['conversas','Conversas',d.conversas.filter(function(c){return c.status==='dono';}).length],['anuncios','Anúncios',anunN],['vendas','Vendas',0],['avisos','Avisos',d.avisos.filter(function(a){return a.status==='enviado';}).length]];
  $('#abas').innerHTML=it.map(function(x){return '<a href="#'+x[0]+'"'+(S.aba===x[0]?' aria-current="page"':'')+'>'+x[1]+(x[2]?'<span class="b">'+x[2]+'</span>':'')+'</a>';}).join('');
  // a aba ativa aparece na faixa (só rola a faixa pro lado; a página não pula pra baixo)
  var at=$('#abas a[aria-current]'),fx=$('#abas');if(at&&fx)fx.scrollLeft=Math.max(0,at.offsetLeft-fx.offsetLeft-(fx.clientWidth-at.offsetWidth)/2);
}

// ---- seções ----
function vazioMaia(t){return '<div class="card vazio maia"><img src="'+FOTO+'" alt="" width="40" height="40"><span>'+t+'</span></div>';}
function secResumo(){
  var d=S.dados,h='<div class="duas"><div>';
  h+='<h2>A Maia espera de ti'+(d.esperando.length?'<small>'+d.esperando.length+'</small>':'')+'</h2>';
  if(d.esperando.length){
    var ic={joinha:'👍',fechou:'?',pergunta:'💬',conversa:'🙋'};
    h+='<ul class="lista card espera">'+d.esperando.map(function(e){
      var alvo=e.tipo==='joinha'?'#anuncios':e.conversa_id?'#conversa='+e.conversa_id:'';
      return '<li'+(alvo?' class="toca" data-ir="'+alvo+'"':'')+'><span class="ic" aria-hidden="true">'+ic[e.tipo]+'</span><div class="mid"><b>'+esc(e.texto)+'</b><span class="l2">'+(e.em?quando(e.em):'')+(e.tipo==='fechou'||e.tipo==='pergunta'?' · responde no WhatsApp da Maia':'')+'</span></div></li>';
    }).join('')+'</ul>';

function liga(el){
  $$('[data-ir]',el).forEach(function(x){x.onclick=function(){location.hash=x.dataset.ir;};});
  $$('[data-lead]',el).forEach(function(x){x.onclick=function(){abreLead(x.dataset.lead);};});
  $$('[data-aprovar]',el).forEach(function(b){b.onclick=function(){
    if(!confirm('Aprovar esse anúncio? A equipe liga a campanha depois.'))return;
    b.disabled=true;api('',{acao:'aprovar',peca_id:b.dataset.aprovar}).then(function(){toast('Aprovado 👍');return carrega();}).catch(function(e){b.disabled=false;toast(e.message);});};});
  $$('[data-ajuste]',el).forEach(function(b){b.onclick=function(){folha('<h3>O que mudar?</h3><p class="mu peq">A Maia refaz, a equipe confere e volta pra ti.</p><label class="campo"><span>Escreve do teu jeito</span><textarea id="f-nota" maxlength="500" placeholder="ex.: troca a foto, fala do parcelamento"></textarea></label><div class="btns" style="margin-top:14px"><button class="btn pri" id="f-ok">Mandar o pedido</button><button class="btn" data-fecha>Cancelar</button></div>',function(v){
    $('#f-ok',v).onclick=function(){var nota=$('#f-nota',v).value.trim();if(!nota){toast('Escreve o que mudar');return;}this.disabled=true;
      api('',{acao:'ajuste',peca_id:b.dataset.ajuste,nota:nota}).then(function(){fecha();toast('Pedido enviado');return carrega();}).catch(function(e){toast(e.message);});};});};});
}

    var bv=$('#f-venda',v);if(bv)bv.onclick=function(){var val=$('#f-valor',v).value.trim();if(!confirm('Marcar venda de '+(l.nome||'esse contato')+(val?' por R$ '+val:'')+'?'))return;bv.disabled=true;
      api('',{acao:'venda',lead_id:l.id,valor:val,produto:$('#f-prod',v).value.trim()}).then(function(){fecha();toast('Venda marcada 💰');return carrega();}).catch(function(e){bv.disabled=false;toast(e.message);});};
    var bp=$('#f-perda',v);if(bp)bp.onclick=function(){var m=$('#f-mot',v).value;if(!m){toast('Escolhe o motivo');return;}if(!confirm('Marcar '+(l.nome||'esse contato')+' como perdido?'))return;bp.disabled=true;
      api('',{acao:'perda',lead_id:l.id,motivo:m}).then(function(){fecha();toast('Marcado como perdido');return carrega();}).catch(function(e){bp.disabled=false;toast(e.message);});};
  });
}
function abreConversa(id){
  var c=(S.dados&&S.dados.conversas||[]).filter(function(x){return x.id===id;})[0];
  $('#app').innerHTML='<div class="chat-top"><button type="button" id="volta" aria-label="Voltar">←</button>'+av(c&&(c.nome||c.telefone),id)+'<span><b>'+esc(c?(c.nome||fone(c.telefone)):'Conversa')+'</b><small>'+(c?esc(fone(c.telefone))+' · '+(ST_CV[c.status]||ST_CV.maia)[0]:'')+'</small></span></div><div class="chat" id="chat"><div class="esq" style="height:40px;width:60%"></div><div class="esq" style="height:40px;width:50%;align-self:flex-end"></div></div>';
  $('#volta').onclick=function(){location.hash='conversas';};
  api('acao=conversa&id='+encodeURIComponent(id)).then(function(r){
    var h='',dia='';
    r.msgs.forEach(function(m){var d=new Date(m.criado_em).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});if(d!==dia){dia=d;h+='<span class="dia">'+esc(d)+'</span>';}
      var cli=m.autor==='cliente';
      h+='<div class="bol '+(cli?'cli':'eu')+'">'+(cli?'':'<span class="quem'+(m.autor==='dono'?' dono':'')+'">'+(m.autor==='dono'?'Tu':'<img src="'+FOTO+'" alt="" width="16" height="16">Maia')+'</span>')+esc(m.texto||'('+(m.tipo||'mensagem')+')')+'<span class="h">'+hora(m.criado_em)+'</span></div>';});
    $('#chat').innerHTML=h||'<div class="vazio">Sem mensagens.</div>';
  }).catch(function(e){$('#chat').innerHTML='<div class="vazio">'+esc(e.message)+'</div>';});
}

window.addEventListener('hashchange',lerHash);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.dados&&!S.conversa)carrega().catch(function(){});});
entrar().then(carrega).then(lerHash).catch(function(e){
  // sem link e sem cookie: a pessoa abriu /maia/painel direto. "Venceu" só quando um link existiu e foi recusado.
  if(e.status===401&&!TINHA_LINK&&e.motivo==='sem_link') porta('Abre o painel pelo link que a Maia te mandou','O painel é só teu e abre pelo link que eu mando no WhatsApp. Não achou a mensagem? É só me pedir: escreve "meu painel".','Pedir o link pra Maia');
  else if(e.status===401) porta('Esse link venceu','O link do painel vale 30 dias e é só teu. Pede um novo pra Maia: é só escrever "meu painel" no WhatsApp.');
  else if(e.status===429) porta('Muitas tentativas','Espera 15 minutos e abre o link de novo.');
  else porta('Não deu pra abrir agora',(e.message||'')+'. Tenta de novo em um minuto.');
});
})();
</script>
