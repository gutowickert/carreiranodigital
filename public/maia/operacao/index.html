  var kv=$('#kv');
  function linha(k,v){
    var d=document.createElement('div'); d.className='kv-linha';
    var txt=(v!=null&&typeof v==='object')?JSON.stringify(v,null,1):(v==null?'':String(v));
    d.innerHTML='<input placeholder="assunto (ex.: precos)" value="'+esc(k)+'" aria-label="assunto"><textarea rows="1" placeholder="o que ela precisa saber" aria-label="o que a Maia sabe sobre esse assunto">'+esc(txt)+'</textarea><button class="x" type="button" title="tirar" aria-label="tirar esse assunto">'+ic('x')+'</button>';
    $('.x',d).onclick=function(){ d.remove(); };
    kv.appendChild(d);
  }
  var ctx=n.contexto||{}; Object.keys(ctx).forEach(function(k){ linha(k,ctx[k]); });
  if(!Object.keys(ctx).length){ ['servicos','precos','publico','horario','tom'].forEach(function(k){ linha(k,''); }); }
  $('#kv-mais').onclick=function(){ linha('',''); $$('.kv-linha input',kv).pop().focus(); };
  $('#kv-salvar').onclick=function(){
    var novo={};
    $$('.kv-linha',kv).forEach(function(l){
      var k=$('input',l).value.trim(), v=$('textarea',l).value.trim(); if(!k||!v) return;
      if(/^[\[{]/.test(v)){ try{ novo[k]=JSON.parse(v); return; }catch(e){} }
      if(/^-?\d+(\.\d+)?$/.test(v)) novo[k]=Number(v); else if(v==='sim'||v==='true') novo[k]=true; else if(v==='não'||v==='false') novo[k]=false; else novo[k]=v;
    });
    var b=this; espera(b,'salvando…',function(){ return api({acao:'atualizar_negocio',id:n.id,contexto:novo}).then(function(r){ n.contexto=(r&&r.contexto)||novo; toast('A Maia já sabe disso.'); }); });
  };
}
/* 07/11 (piloto): o jeito de atender os clientes desse negócio (meta.atendimento) */
function atCfg(n){ return (n.meta&&n.meta.atendimento)||{}; }
function opt(v,rot,atual){ return '<option value="'+v+'"'+(String(atual)===String(v)?' selected':'')+'>'+rot+'</option>'; }
function cardAtendimento(n){
  var a=atCfg(n), t=a.tom||{};
  return '<form class="card" id="f-atend"><h2 style="margin-bottom:6px">Jeito de falar com os clientes</h2><p class="mu peq" style="margin:0 0 12px">Só no atendimento dos clientes do negócio. Com o dono, a Maia fala do jeito dela.</p><div class="grade2">'+
    '<div class="campo"><label for="t-pessoa">Tratamento</label><select id="t-pessoa" name="pessoa">'+opt('voce','você',t.pessoa||'voce')+opt('tu','tu',t.pessoa||'voce')+'</select></div>'+
    '<div class="campo"><label for="t-gaucho">Jeito gaúcho</label><select id="t-gaucho" name="gaucho">'+opt('nao','não (neutro)',t.gaucho?'sim':'nao')+opt('sim','sim, leve',t.gaucho?'sim':'nao')+'</select></div>'+
    '<div class="campo"><label for="t-estilo">Estilo</label><select id="t-estilo" name="estilo">'+opt('leve','leve',t.estilo||'leve')+opt('formal','formal',t.estilo||'leve')+'</select></div>'+
    '<div class="campo"><label for="t-franquia">Conversas por mês (vazio = a do plano)</label><input id="t-franquia" name="franquia" type="number" min="1" class="num" placeholder="'+(n.plano==='completa'?'1000 (Completa)':n.plano==='gestao'?'sem franquia (Gestora)':'500 (Essencial)')+'" value="'+esc(a.franquia||'')+'"></div>'+
    '<div class="campo"><label for="t-guarda">Guardar as conversas por (meses)</label><input id="t-guarda" name="guarda_meses" type="number" min="1" max="60" class="num" placeholder="12" value="'+esc(a.guarda_meses||'')+'"></div>'+
    '<div class="campo"><label for="t-priv">Aviso de privacidade na 1ª resposta</label><select id="t-priv" name="priv_ligado">'+opt('sim','sim',(a.privacidade&&a.privacidade.ligado===false)?'nao':'sim')+opt('nao','não',(a.privacidade&&a.privacidade.ligado===false)?'nao':'sim')+'</select></div>'+
    '<div class="campo"><label for="t-plink">Link da política (opcional)</label><input id="t-plink" name="priv_link" type="url" placeholder="https://…" value="'+esc((a.privacidade&&a.privacidade.link)||'')+'"></div>'+
    '</div><div class="campo"><label for="t-ptexto">Texto do aviso (vazio = o padrão)</label><textarea id="t-ptexto" name="priv_texto" rows="2" placeholder="Um aviso rápido: este atendimento é feito por uma assistente virtual (IA) do negócio. Suas mensagens ficam guardadas só pra atender você. Se quiser que a gente apague seus dados, é só pedir aqui.">'+esc((a.privacidade&&a.privacidade.texto)||'')+'</textarea></div>'+
    '<button class="btn ok larga">'+ic('check')+'Salvar o jeito de atender</button></form>'+
    '<div class="card" id="uso-mes" aria-live="polite"><h2 style="margin-bottom:10px">Conversas do mês</h2><div class="esq" style="height:34px;width:50%"></div></div>';
}
/* conversa do mês = contato diferente que mandou pelo menos 1 mensagem no mês (simuladas à parte; ver lib/maia/uso.ts) */
function pintaUso(n){
  var el=$('#uso-mes'); if(!el) return;
  api(q({acao:'uso_mes',negocio:n.id})).then(function(u){
    var p=Math.min(100,u.pct||0), cor=u.pct>=100?'var(--red)':u.pct>=80?'var(--amber)':'var(--green)';
    el.innerHTML='<h2 style="margin-bottom:10px">Conversas do mês <small class="mu peq">'+esc(u.mes)+'</small></h2>'+
      '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><b class="num" style="font-size:28px">'+inteiro(u.conversas)+'</b><span class="mu">'+(u.franquia?'de '+inteiro(u.franquia)+' · '+pct(u.pct):'sem franquia (plano Gestora)')+'</span></div>'+
      '<div role="img" aria-label="'+pct(u.pct)+' da franquia" style="height:8px;border-radius:99px;background:var(--surface-2);margin:10px 0;overflow:hidden"><i style="display:block;height:100%;width:'+p+'%;background:'+cor+'"></i></div>'+
      '<p class="mu peq" style="margin:0">Custo de IA no mês: <b>'+real(u.custo_ia)+'</b>'+(u.custo_por_conversa!=null?' · '+real(u.custo_por_conversa)+' por conversa':'')+(u.simuladas?' · '+plural(u.simuladas,'conversa simulada','conversas simuladas')+' (não contam)':'')+'. Passar da franquia não bloqueia o atendimento: a equipe é avisada em 80% e 100%.</p>';
  }).catch(function(e){ el.innerHTML='<h2 style="margin-bottom:10px">Conversas do mês</h2>'+caixaErro(e); });
}
function ligaCardAtendimento(n){
  var f=$('#f-atend'); if(!f) return;
  pintaUso(n);
  f.onsubmit=function(ev){ ev.preventDefault(); var d=Object.fromEntries(new FormData(f).entries());
    var c={acao:'config_atendimento',negocio_id:n.id,tom:{pessoa:d.pessoa,gaucho:d.gaucho==='sim',estilo:d.estilo},franquia:d.franquia?Number(d.franquia):0,guarda_meses:d.guarda_meses?Number(d.guarda_meses):0,privacidade:{ligado:d.priv_ligado!=='nao',texto:d.priv_texto||'',link:d.priv_link||''}};
    espera($('button',f),'salvando…',function(){ return api(c).then(function(r){ n.meta=Object.assign({},n.meta||{},{atendimento:r.atendimento}); toast('Jeito de atender salvo.'); pintaUso(n); }); });
  };
}
function recarregaCab(n){
  var de=new Date(Date.now()-30*DIA).toISOString(), ate=new Date().toISOString();
  api(q({acao:'numeros',negocio:n.id,de:de,ate:ate})).then(function(r){ if(S.negAtual&&S.negAtual.id===n.id) pintaCabNeg(n,r); }).catch(function(){});
}

/* --- peças do negócio --- */
function subPecas(n,box){
  box.innerHTML='<details class="card dobra"><summary><span class="mais">'+ic('mais')+'</span>Criar anúncios<small>usa as fotos e vídeos que o dono mandou</small></summary><div class="miolo"><form id="f-gerar"><p class="mu peq" style="margin:0 0 12px">A Maia escreve os anúncios usando as fotos e vídeos que o dono mandou e manda pra oficina fazer a arte.</p><div class="grade2">'+
    '<div class="campo"><label for="g-qtd">Quantos</label><select id="g-qtd" name="quantidade">'+[1,2,3,4,5,6].map(function(x){return '<option'+(x===3?' selected':'')+'>'+x+'</option>';}).join('')+'</select></div>'+
    cmp('tema','Tema (opcional)','text','Ex.: Dia das Mães, promoção de inverno')+
    '</div><button class="btn ok larga">'+ic('brilho')+'Criar anúncios</button></form></div></details>'+
    '<div id="joinha" style="margin-top:14px"></div><div id="pecas-c">'+esqCards(3)+'</div>';
  var f=$('#f-gerar');
  f.onsubmit=function(ev){ ev.preventDefault(); var d=Object.fromEntries(new FormData(f).entries());
    espera($('button',f),'a Maia está escrevendo…',function(){ return api({acao:'gerar_anuncios',negocio_id:n.id,quantidade:Number(d.quantidade),tema:d.tema||undefined}).then(function(r){
      if(r&&r.ok===false) throw new Error(r.erro||'não gerou');
      var qt=(r&&r.pecas?r.pecas.length:0);
      if(!qt) toast('A Maia não criou nenhum anúncio: as fotos e vídeos do dono podem não servir pra esse negócio. Pede fotos melhores pra ele.',true);
      else toast(qt+' anúncio(s) criado(s). Foram pra oficina fazer a arte.');
      S.cart=null; return carrega(); }); });
  };
  function carrega(){ return api(q({acao:'pecas',negocio:n.id})).then(function(ps){ S.pecas=(ps||[]).map(function(p){ p.negocio_nome=n.nome; return p; }); pinta(); }).catch(function(e){ if($('#pecas-c')) $('#pecas-c').innerHTML=caixaErro(e); }); }
  function pinta(){
    var ps=S.pecas||[], c=$('#pecas-c'); if(!c) return;
    var comDono=ps.filter(function(p){return p.status==='com_dono';}).length;
    $('#joinha').innerHTML=comDono?'<div class="barra-joinha"><span class="ic-g">'+ic('joinha')+'</span><p><b>'+plural(comDono,'peça','peças')+'</b> com o dono esperando o joinha.</p><button class="btn pri" id="b-joinha">'+ic('enviar')+'Pedir o joinha do dono</button></div>':'';
    if($('#b-joinha')) $('#b-joinha').onclick=function(){ espera(this,'mandando…',function(){ return api({acao:'pedir_joinha',negocio_id:n.id}).then(function(){ delete S.aprovadasSessao[n.id]; toast('Pedi o joinha pro dono.'); }); }); };
    if(!ps.length){ c.innerHTML='<div class="card">'+vazio('imagem','Nenhuma peça ainda','O dono manda fotos no WhatsApp e tu clicas em “Criar anúncios”.')+'</div>'; return; }
    var ordem=['revisao_equipe','gerando','ajuste_equipe','ajuste_dono','com_dono','aprovada','no_ar','erro','descartada'], h='', primeiro=true;
    ordem.forEach(function(s){ var g=ps.filter(function(p){return p.status===s;}); if(!g.length) return;
      var x=PECA_ST[s]||[s,''];
      h+='<div class="secao-t"'+(primeiro?' style="margin-top:0"':'')+'>'+esc(x[0])+' '+chip(String(g.length),x[1])+'</div><div class="pecas">'+g.map(function(p){return cardPeca(p,false);}).join('')+'</div>'; primeiro=false; });
    c.innerHTML=h; ligaPecas(c,pinta,carrega);
  }
  carrega();
}

/* --- funil --- */
function subFunil(n,box){
  box.innerHTML='<details class="card dobra"><summary><span class="mais">'+ic('mais')+'</span>Novo contato no funil<small>quem chamou fora do WhatsApp da Maia</small></summary><div class="miolo"><form id="f-lead"><div class="grade2">'+
    cmp('nome','Nome','text','Ex.: Ana Paula',true)+cmp('telefone','Telefone','tel','Ex.: 51 99999-0000')+cmp('produto','Produto ou serviço','text','Ex.: limpeza de pele')+
    '<div class="campo"><label for="l-origem">De onde veio</label><select id="l-origem" name="origem">'+Object.keys(ORIGEM_NOME).map(function(k){return '<option value="'+k+'"'+(k==='outro'?' selected':'')+'>'+ORIGEM_NOME[k]+'</option>';}).join('')+'</select></div>'+
    '</div><button class="btn ok larga">'+ic('mais')+'Pôr no funil</button></form></div></details><div id="funil-c" style="margin-top:14px"><div class="esq" style="height:280px;border-radius:16px"></div></div>';
  var f=$('#f-lead');
  f.onsubmit=function(ev){ ev.preventDefault(); var d=Object.fromEntries(new FormData(f).entries());
    espera($('button',f),'salvando…',function(){ return api({acao:'lead_novo',negocio_id:n.id,nome:d.nome,telefone:d.telefone||undefined,produto:d.produto||undefined,origem:d.origem}).then(function(){ f.reset(); S.cart=null; toast('Contato no funil.'); return carrega(); }); });
  };
  function carrega(){ return api(q({acao:'leads',negocio:n.id})).then(function(ls){ S.leads=ls||[]; pinta(); }).catch(function(e){ if($('#funil-c')) $('#funil-c').innerHTML=caixaErro(e); }); }
  function cardLead(l){
    var ab=S.leadAcao&&S.leadAcao.id===l.id?S.leadAcao.tipo:null, a='';
    if(ab==='ganho') a='<div class="campo" style="margin:0"><label for="v-'+esc(l.id)+'">Valor da venda (R$)</label><input id="v-'+esc(l.id)+'" type="number" inputmode="decimal" step="any" min="0" data-valor value="'+(l.valor!=null?esc(l.valor):'')+'"></div><input data-prod aria-label="produto (opcional)" placeholder="produto (opcional)" value="'+esc(l.produto||'')+'"><div class="btns"><button class="btn verde peq" data-l="ganho-ok">'+ic('check')+'Confirmar venda</button><button class="btn peq" data-l="cancelar">Voltar</button></div>';
    else if(ab==='perdido') a='<div class="campo" style="margin:0"><label for="m-'+esc(l.id)+'">Por que perdeu?</label><input id="m-'+esc(l.id)+'" data-motivo placeholder="Ex.: achou caro, comprou em outro lugar"></div><div class="btns"><button class="btn perigo cheio peq" data-l="perdido-ok">Marcar perdido</button><button class="btn peq" data-l="cancelar">Voltar</button></div>';
    else a='<select data-etapa aria-label="Mudar a etapa de '+esc(l.nome||'contato')+'">'+ETAPAS.map(function(e){return '<option value="'+e+'"'+(l.etapa===e?' selected':'')+'>'+ETAPA_NOME[e]+'</option>';}).join('')+'</select>'+
      (l.etapa!=='ganho'&&l.etapa!=='perdido'?'<div class="btns"><button class="btn verde peq" data-l="ganho">Ganho</button><button class="btn perigo peq" data-l="perdido">Perdido</button></div>':'');
    var venc=vencido(l.proximo_followup_em);
    return '<div class="lead '+esc(l.etapa)+'" data-lead="'+esc(l.id)+'"><div class="topo"><b class="nome">'+esc(l.nome||'sem nome')+'</b>'+(l.valor!=null?'<span class="valor">'+real(l.valor)+'</span>':'')+'</div><div class="det">'+
      (l.produto?'<span>'+esc(l.produto)+'</span>':'')+
      '<span class="tags">'+chip(ORIGEM_NOME[l.origem]||l.origem||'—','')+(l.telefone?'<span class="num">'+esc(l.telefone)+'</span>':'')+'</span>'+
      (l.motivo_perda&&l.etapa==='perdido'?'<span>motivo: '+esc(l.motivo_perda)+'</span>':'')+
      (l.proximo_followup_em&&l.etapa!=='ganho'&&l.etapa!=='perdido'?'<span class="'+(venc?'vence':'')+'">'+ic('relogio')+' retomada '+(venc?'vencida ('+haQuanto(l.proximo_followup_em)+')':haQuanto(l.proximo_followup_em))+(l.followups?' · '+l.followups+'ª feita':'')+'</span>':'')+
      (l.resumo?'<span class="res">'+esc(l.resumo)+'</span>':'')+
      '<span class="fr">'+(l.etapa==='ganho'&&l.ganho_em?'vendeu '+haQuanto(l.ganho_em):'último contato '+haQuanto(l.ultimo_contato_em||l.atualizado_em))+'</span>'+
      '</div><div class="acoes">'+a+'</div></div>';
  }
  function pinta(){
    var ls=S.leads||[], c=$('#funil-c'); if(!c) return;
    if(!ls.length){ c.innerHTML='<div class="card">'+vazio('funil','Funil vazio','Os contatos entram quando um cliente chama no WhatsApp, quando o dono conta uma venda, ou pelo botão acima.')+'</div>'; return; }
    function soma(g){ return g.reduce(function(s,l){return s+(Number(l.valor)||0);},0); }
    var abertos=ls.filter(function(l){return l.etapa!=='ganho'&&l.etapa!=='perdido';}), ganhos=ls.filter(function(l){return l.etapa==='ganho';});
    c.innerHTML='<div class="funil-res"><span><b>'+abertos.length+'</b> em aberto'+(soma(abertos)?' · <b>'+real(soma(abertos))+'</b> em negociação':'')+'</span><span><b>'+ganhos.length+'</b> ganhos · <b style="color:var(--green)">'+real(soma(ganhos))+'</b></span></div>'+
      '<div class="kanban-w"><div class="kanban">'+ETAPAS.map(function(e){ var g=ls.filter(function(l){return l.etapa===e;}), v=soma(g);
      return '<section class="coluna '+e+(g.length?'':' vazia')+'" aria-label="'+ETAPA_NOME[e]+'"><div class="ch"><div><h3>'+ETAPA_NOME[e]+'</h3><span class="v">'+(v?real(v):'&nbsp;')+'</span></div><span class="c">'+g.length+'</span></div>'+(g.length?g.map(cardLead).join(''):'<div class="nada">Ninguém aqui.</div>')+'</section>'; }).join('')+'</div></div>';
    $$('[data-lead]',c).forEach(function(el){
      var id=el.dataset.lead;
      var sel=$('[data-etapa]',el); if(sel) sel.onchange=function(){
        var e=sel.value; if(e==='ganho'||e==='perdido'){ S.leadAcao={id:id,tipo:e}; return pinta(); }
        sel.disabled=true; api({acao:'lead_etapa',lead_id:id,etapa:e}).then(function(){ S.cart=null; toast('Movido pra '+ETAPA_NOME[e]+'.'); return carrega(); }).catch(function(x){ falhou(x); pinta(); });
      };
      $$('[data-l]',el).forEach(function(b){ b.onclick=function(){
        var a=b.dataset.l;
        if(a==='cancelar'){ S.leadAcao=null; return pinta(); }
        if(a==='ganho'||a==='perdido'){ S.leadAcao={id:id,tipo:a}; pinta(); var i=$('[data-lead="'+id+'"] input'); if(i) i.focus(); return; }
        if(a==='ganho-ok'){ var v=$('[data-valor]',el).value, pr=$('[data-prod]',el).value.trim();
          return espera(b,'salvando…',function(){ return api({acao:'lead_ganho',lead_id:id,valor:v===''?null:Number(v),produto:pr||undefined}).then(function(){ S.leadAcao=null; S.cart=null; toast('Venda registrada.'); recarregaCab(n); return carrega(); }); }); }
        if(a==='perdido-ok'){ var m=$('[data-motivo]',el).value.trim();
          return espera(b,'salvando…',function(){ return api({acao:'lead_perdido',lead_id:id,motivo:m||'sem motivo'}).then(function(){ S.leadAcao=null; S.cart=null; toast('Marcado como perdido.'); return carrega(); }); }); }
      }; });
    });
  }
  carrega();
}

/* --- números --- */
function subNumeros(n,box){
  box.innerHTML='<div class="card-cab"><h2>Números</h2><div class="periodo" id="per" role="group" aria-label="Período"><button data-d="7">7 dias</button><button data-d="30">30 dias</button></div></div><div id="num-c"></div>';
  var extras=null;
  function carrega(){
    $$('#per button').forEach(function(b){ var on=Number(b.dataset.d)===S.periodo; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); });
    var de=new Date(Date.now()-S.periodo*DIA).toISOString(), ate=new Date().toISOString();
    $('#num-c').innerHTML=esqKpis(4)+'<div style="margin-top:14px">'+esqBloco(170)+'</div>';
    var pExtras=extras?Promise.resolve(extras):Promise.all([
      api(q({acao:'leads',negocio:n.id})).catch(function(){return [];}),
      api(q({acao:'campanhas',negocio:n.id})).catch(function(){return [];}),
      api(q({acao:'pecas',negocio:n.id})).catch(function(){return [];})
    ]).then(function(x){ extras={leads:x[0]||[],camps:x[1]||[],pecas:x[2]||[]}; return extras; });
    Promise.all([api(q({acao:'numeros',negocio:n.id,de:de,ate:ate})),pExtras]).then(function(res){
      var r=res[0], ex=res[1]; if(!$('#num-c')) return;
      function k(icone,rot,v,pe,cls){ return '<div class="kpi '+(cls||'')+'"><div class="kpi-rot">'+rot+'</div><div class="kpi-num">'+v+'</div><div class="kpi-pe">'+pe+'</div></div>'; }
      function p(v){ return '<span>'+v+'</span>'; }
      var h='<div class="kpis">'+
        k('dinheiro','Receita',realGrande(r.receita),r.ticket_medio!=null?'ticket médio '+real(r.ticket_medio):'nenhuma venda no período','',true)+
        k('festa','Vendas',p(inteiro(r.ganhos)),'conversão '+pct(r.conversao)+' (vendas ÷ contatos)',r.ganhos?'bom':'')+
        k('pessoas','Contatos novos',p(inteiro(r.leads_novos)),inteiro(r.em_aberto)+' em aberto · '+inteiro(r.perdidos)+' perdidos')+
        k('alvo','Custo por venda',r.custo_por_venda!=null?realGrande(r.custo_por_venda):'<span class="vazio-n">—</span>',r.custo_por_venda!=null?'custo por contato '+real(r.custo_por_lead):'sem investimento registrado')+
        '</div>';
      // anúncios na Meta: uma lista curta em vez de mais quatro cartões
      function ln(rot,sub,v,cls){ return '<div class="lin" style="grid-template-columns:minmax(0,1fr) auto;padding-left:0"><span><span class="t" style="font-size:14px"><span>'+rot+'</span></span><span class="sub" style="display:block">'+sub+'</span></span><b class="num" style="font-size:18px'+(cls?';color:var(--'+cls+')':'')+'">'+v+'</b></div>'; }
      var meta='<section class="box"><h2>Anúncios na Meta</h2><div class="lista">'+
        ln('Investimento','no período',real(r.gasto))+
        ln('Conversas iniciadas','pela Meta',inteiro(r.conversas_meta))+
        ln('Retorno','receita ÷ investimento',vezes(r.retorno),r.retorno!=null&&r.retorno>=1?'green':(r.retorno!=null&&r.retorno<1?'red':''))+
        ln('Retomadas agendadas','contatos em aberto com retomada marcada',inteiro(r.retomadas_pendentes))+
        '</div></section>';
      // por dia (dos contatos da API)
      var dias=[]; for(var i=S.periodo-1;i>=0;i--) dias.push(chaveDia(Date.now()-i*DIA));
      var cont={},rec={}; dias.forEach(function(d){cont[d]=0;rec[d]=0;});
      ex.leads.forEach(function(l){ var c=chaveDia(l.criado_em); if(c in cont) cont[c]++; if(l.ganho_em){ var g=chaveDia(l.ganho_em); if(g in rec) rec[g]+=Number(l.valor)||0; } });
      var vc=dias.map(function(d){return cont[d];}), vr=dias.map(function(d){return rec[d];});
      // um gráfico só: contatos e vendas por dia
      var vv={}; dias.forEach(function(d){vv[d]=0;}); ex.leads.forEach(function(l){ if(l.ganho_em){ var g=chaveDia(l.ganho_em); if(g in vv) vv[g]++; } });
      var vvs=dias.map(function(d){return vv[d];});
      h+='<div class="grid g2" style="margin-top:16px">'+
        '<section class="box"><h2>Contatos e vendas por dia <small>'+plural(vc.reduce(function(a,b){return a+b;},0),'contato')+' · '+real(vr.reduce(function(a,b){return a+b;},0))+' em vendas</small></h2>'+grafColunas(dias,[{vals:vc,nome:'Contatos'},{vals:vvs,nome:'Vendas',cls:'v'}],{aria:'Contatos novos e vendas por dia',rotulos:7})+
          '<div class="legenda" style="margin-top:10px"><span><i></i>Contatos novos</span><span><i class="v"></i>Vendas</span></div></section>'+
        meta+
      '</div>';
      // de onde vieram: o código do anúncio vira o gancho da peça (campanha liga anúncio e peça)
      var adPeca={}; ex.camps.forEach(function(c){ (c.meta_ad_ids||[]).forEach(function(ad,i){ var pid=(c.peca_ids||[])[i]; var pc=ex.pecas.filter(function(x){return x.id===pid;})[0]; if(pc) adPeca[ad]=pc; }); });
      var orig=r.por_origem||{}, ks=Object.keys(orig).sort(function(a,b){return orig[b].receita-orig[a].receita||orig[b].leads-orig[a].leads;});
      var mxL=1; ks.forEach(function(k2){ if(orig[k2].leads>mxL) mxL=orig[k2].leads; });
      h+='<div class="metade" style="margin-top:14px"><section class="card"><div class="card-cab"><h3>De onde vieram</h3></div>'+(ks.length?'<div class="hb">'+
        ks.map(function(k2){ var o=orig[k2], pc=adPeca[k2], nome=ORIGEM_NOME[k2]?ORIGEM_NOME[k2]:(pc?'Anúncio: '+(pc.gancho||pc.titulo||'sem gancho'):'Anúncio ('+k2+')');
          return '<div class="l"><div class="top"><span>'+esc(nome)+'</span><b>'+plural(o.leads,'contato')+' · '+plural(o.ganhos,'venda')+(o.receita?' · '+real(o.receita):'')+'</b></div><div class="trilho"><i style="width:'+Math.round(o.leads/mxL*100)+'%"></i></div></div>'; }).join('')+'</div>':vazio('pessoas','Nenhum contato no período','Quando alguém chamar, aparece aqui de onde veio.'))+'</section>';
      var mot=r.motivos_perda||{}, mk=Object.keys(mot).sort(function(a,b){return mot[b]-mot[a];}), mx=mk.length?mot[mk[0]]:1;
      h+='<section class="card"><div class="card-cab"><h3>Por que perdeu</h3><span class="total">'+inteiro(r.perdidos)+'</span></div>'+(mk.length?'<div class="hb">'+mk.map(function(m){ return '<div class="l"><div class="top"><span>'+esc(m)+'</span><b>'+mot[m]+'</b></div><div class="trilho"><i class="r" style="width:'+Math.round(mot[m]/mx*100)+'%"></i></div></div>'; }).join('')+'</div>':vazio('okc','Nenhuma perda no período','Bom sinal. Quando um contato for perdido, o motivo aparece aqui.'))+'</section></div>'+
        '<p class="fr peq" style="margin-top:12px">Período: '+esc(r.periodo&&r.periodo.de)+' até '+esc(r.periodo&&r.periodo.ate)+'.</p>';
      $('#num-c').innerHTML=h;
    }).catch(function(e){ if($('#num-c')) $('#num-c').innerHTML=caixaErro(e); });
  }
  $$('#per button').forEach(function(b){ b.onclick=function(){ S.periodo=Number(b.dataset.d); carrega(); }; });
  carrega();
}

/* --- campanhas --- */
function subCampanhas(n,box){
  box.innerHTML='<div class="aviso">'+ic('info')+'<span>A campanha sobe <b>pausada</b>. Só liga depois do joinha do dono em todas as peças dela'+(n.ativa_sozinha?' (este negócio está configurado pra ligar sozinho com o joinha).':'.')+'</span></div>'+
    '<details class="card dobra" style="margin-top:14px"><summary><span class="mais">'+ic('mais')+'</span>Montar campanha pausada<small>usa os anúncios que o dono já aprovou</small></summary><div class="miolo"><form id="f-camp"><p class="mu peq" style="margin:0 0 12px">Usa os anúncios que o dono já aprovou com o joinha. Precisa do ID da conta de anúncio e da página (na aba “Dados”).</p><div class="grade2">'+
    cmp('verba_dia','Verba por dia (R$)','number','',true,n.verba_dia||'')+cmp('raio_km','Raio em km','number','',true,15)+
    '</div><button class="btn ok larga">'+ic('megafone')+'Montar campanha pausada</button></form></div></details><div id="camp-c" style="margin-top:14px">'+esqBloco(100)+'</div>';
  var f=$('#f-camp');
  f.onsubmit=function(ev){ ev.preventDefault(); var d=Object.fromEntries(new FormData(f).entries());
    espera($('button',f),'montando…',function(){ return api({acao:'criar_campanha',negocio_id:n.id,verba_dia:Number(d.verba_dia),raio_km:Number(d.raio_km)}).then(function(){ S.cart=null; toast('Campanha montada e pausada.'); return carrega(); }); });
  };
  var conf=null, pecas=[];
  function carrega(){ return Promise.all([api(q({acao:'campanhas',negocio:n.id})), api(q({acao:'pecas',negocio:n.id})).catch(function(){return [];})]).then(function(r){ S.camps=r[0]||[]; pecas=r[1]||[]; pinta(); }).catch(function(e){ if($('#camp-c')) $('#camp-c').innerHTML=caixaErro(e); }); }
  function pinta(){
    var cs=S.camps||[], c=$('#camp-c'); if(!c) return;
    if(!cs.length){ c.innerHTML='<div class="card">'+vazio('megafone','Nenhuma campanha ainda','Quando o dono aprovar os anúncios, monta a campanha pausada no botão acima.')+'</div>'; return; }
    c.innerHTML='<div class="pilha">'+cs.map(function(k){
      var pub=k.publico||{}, ac='';
      if(k.status==='criada_pausada'||k.status==='pausada') ac= conf===k.id
        ? '<div class="confirma verde"><p>Ligar agora? Começa a gastar '+real(k.verba_dia)+' por dia.</p><div class="btns"><button class="btn ok" data-c="ligar-sim">'+ic('play')+'Sim, ligar</button><button class="btn" data-c="nao">Voltar</button></div></div>'
        : '<div class="btns"><button class="btn ok" data-c="ligar">'+ic('play')+'Ligar campanha</button></div>';
      if(k.status==='ativa') ac='<div class="btns"><button class="btn perigo" data-c="pausar">'+ic('pausa')+'Pausar</button></div>';

    }).join('')+'</div>';

/* --- conversas (dono e clientes), estilo WhatsApp --- */
var QUEM={dono:'Dono',maia:'Maia',equipe:'Equipe',sistema:'Sistema',cliente:'Cliente'};
function balao(m,nomes,canal){
  var a=m.autor||'sistema', t=m.texto;
  var lado = a==='sistema'?'':((canal==='cliente'?(a==='cliente'):(a==='dono'||a==='cliente'))?'esq':'dir');
  var corpo = t?esc(t):'<span class="midia-t">'+ic(m.tipo==='imagem'||m.tipo==='image'?'imagem':'arquivo')+'('+esc(m.tipo||'mídia')+')</span>';
  return '<div class="bal '+esc(a)+' '+lado+'"><span class="quem">'+esc(nomes[a]||QUEM[a]||a)+'</span>'+corpo+'<span class="hora">'+hora(m.criado_em)+'</span></div>';
}
function bolhasComDia(msgs,nomes,canal){
  var h='', ult='';
  msgs.forEach(function(m){ var d=chaveDia(m.criado_em); if(d!==ult){ h+='<div class="dia">'+esc(rotuloDia(m.criado_em))+'</div>'; ult=d; } h+=balao(m,nomes,canal); });
  return h;
}
function subConversa(n,box){
  box.innerHTML='<div class="cv"><div class="card cv-lista" id="cv-l" aria-label="Conversas">'+esqLinhas(3)+'</div><div class="card cv-chat" id="cv-c"><div class="esq" style="height:420px;border-radius:0"></div></div></div>';
  var convs=[];
  function carrega(){
    return api(q({acao:'conversas',negocio:n.id})).then(function(cs){
      convs=(cs||[]).slice().sort(function(a,b){ if(a.canal==='dono'&&b.canal!=='dono') return -1; if(b.canal==='dono'&&a.canal!=='dono') return 1; return String(b.ultima_msg_em||'').localeCompare(String(a.ultima_msg_em||'')); });
      var dono=convs.filter(function(c){return c.canal==='dono';})[0]||null;
      if(!S.cvSel || !convs.some(function(c){return c.id===S.cvSel;})) S.cvSel=dono?dono.id:'__dono';
      pintaLista(); return abre();
    }).catch(function(e){ if($('#cv-c')) $('#cv-c').innerHTML='<div style="padding:16px">'+caixaErro(e)+'</div>'; if($('#cv-l')) $('#cv-l').innerHTML=''; });
  }
  function pintaLista(){

    l.innerHTML=itens.map(function(c){ var dono=c.canal==='dono', nm=dono?(n.dono_nome||'Dono'):(c.nome||c.telefone||'Cliente');

      (convs.filter(function(c){return c.canal!=='dono';}).length?'':'<p class="fr peq" style="padding:8px 10px">Nenhum cliente conversou com a Maia ainda.</p>');

  }

  }

    var c=$('#cv-c'); if(!c) return;

    c.innerHTML='<div class="cv-topo"><span class="av '+(dono?'dono':'')+'">'+inicial(nm)+'</span><div class="tx"><b>'+esc(nm)+'</b><small class="num">'+esc(dono?(n.dono_whatsapp||''):(cv.telefone||''))+' · '+(cv?(humano?'<b style="display:inline;color:var(--amber)">a equipe assumiu</b>':'a Maia está respondendo'):'sem conversa ainda')+'</small></div>'+
      '<div class="btns" style="flex:0 1 auto">'+(cv?(humano?'<button class="btn ok peq" id="b-devolver">'+ic('robo')+'Devolver pra Maia</button>':'<button class="btn peq" id="b-assumir">'+ic('pessoa')+'Assumir a conversa</button>'):'')+(cv&&!dono?'<button class="btn fantasma peq" id="b-apagar" title="LGPD: apaga conversa, mensagens, contato do funil e mídias desse cliente, só desse negócio">'+ic('x')+'Apagar dados</button>':'')+'<button class="btn fantasma peq" id="b-rec" aria-label="Atualizar a conversa">'+ic('rotina')+'</button></div></div>'+
      '<div class="chat" id="chat" aria-live="polite">'+(msgs.length?bolhasComDia(msgs,nomes,dono?'dono':'cliente'):'<div class="vazio"><div class="q">'+ic('msg')+'</div><b>Nenhuma mensagem ainda</b><p>'+(dono?'Quando o dono falar com a Maia no WhatsApp, aparece aqui.':'Nada nessa conversa ainda.')+'</p></div>')+'</div>'+
      (dono?'<form class="enviar" id="f-msg"><textarea name="texto" placeholder="Mensagem da equipe pro dono…" aria-label="Mensagem da equipe pro dono" required></textarea><button class="btn ok" aria-label="Mandar">'+ic('enviar')+'Mandar</button></form>'+
        '<p class="cv-nota">Vai como mensagem da equipe no WhatsApp da Maia.'+(humano?'':' Dica: assume a conversa antes, se não quiser que a Maia responda junto.')+'</p>'
        :'<form class="enviar" id="f-cli"><textarea name="texto" placeholder="Mensagem da equipe pro cliente…" aria-label="Mensagem da equipe pro cliente" required></textarea><button class="btn ok" aria-label="Mandar">'+ic('enviar')+'Mandar</button></form>'+
          '<p class="cv-nota">Vai pelo WhatsApp do negócio. Passou 24 h da última mensagem do cliente: sai o modelo maia_resposta e a mensagem espera ele responder.'+(humano?'':' Assume a conversa antes, se não quiser que a Maia responda junto.')+'</p>');
    var ch=$('#chat'); ch.scrollTop=ch.scrollHeight;
    $('#b-rec').onclick=function(){ carrega(); };
    if($('#b-assumir')) $('#b-assumir').onclick=function(){ espera(this,'…',function(){ return api({acao:'assumir',conversa_id:cv.id}).then(function(){ S.cart=null; toast(dono?'A equipe assumiu. A Maia para de responder o dono.':'A equipe assumiu. A Maia para de responder esse cliente.'); return carrega(); }); }); };
    if($('#b-devolver')) $('#b-devolver').onclick=function(){ espera(this,'…',function(){ return api({acao:'devolver',conversa_id:cv.id}).then(function(){ S.cart=null; toast('Devolvido pra Maia.'); return carrega(); }); }); };
    if($('#b-apagar')) $('#b-apagar').onclick=function(){
      if(!confirm('Apagar TODOS os dados de '+nm+' neste negócio?\n\nConversa, mensagens, contato do funil, histórico e as fotos e áudios que ele mandou. Não dá pra desfazer.')) return;
      espera(this,'apagando…',function(){ return api({acao:'apagar_contato',negocio_id:n.id,conversa_id:cv.id,confirmar:true}).then(function(r){ S.cart=null; S.cvSel=null; toast('Dados apagados: '+plural(r.msgs,'mensagem','mensagens')+', '+plural(r.midias,'arquivo')+'.'); return carrega(); }); });
    };
    var fcl=$('#f-cli');
    if(fcl) fcl.onsubmit=function(ev){ ev.preventDefault(); var t=fcl.texto.value.trim(); if(!t) return;
      espera($('button',fcl),'…',function(){ return api({acao:'mandar_ao_cliente',negocio_id:n.id,conversa_id:cv.id,texto:t}).then(function(r){ fcl.reset(); toast(r&&r.na_fila?(r.modelo?'Passou 24 h: foi o modelo maia_resposta. A mensagem sai quando o cliente responder.':'Passou 24 h e o modelo maia_resposta não está aprovado: a mensagem ficou guardada.'):'Mandado.'); return carrega(); }); }); };
    var f=$('#f-msg');
    if(f){
      f.texto.onkeydown=function(ev){ if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); f.requestSubmit?f.requestSubmit():f.onsubmit(ev); } };
      f.onsubmit=function(ev){ ev.preventDefault(); var t=f.texto.value.trim(); if(!t) return;
        espera($('button',f),'…',function(){ return api({acao:'mandar_ao_dono',negocio_id:n.id,texto:t}).then(function(){ f.reset(); return carrega(); }); }); };
    }
  }
  carrega();
}

/* --- simulador --- */
function mostraResposta(el,r,quem){
  if(!r){ el.innerHTML='<div class="dica">'+ic('info')+'<span>A Maia não respondeu (a mensagem foi ignorada ou a conversa está com a equipe).</span></div>'; return; }
  var resp=r.respondeu, h='';
  if(r.recebido) h+='<div class="bal dono esq"><span class="quem">'+esc(quem)+' (o que chegou)</span>'+esc(r.recebido)+'</div>';
  if(!resp) h+='<div class="dica">'+ic('info')+'<span>'+(r.recebido!=null?'Mídia guardada. A Maia não responde na hora a foto/vídeo (o dono costuma mandar vários): manda um texto depois.':'Sem resposta da Maia.')+'</span></div>';
  else {
    var ms=resp.mensagens||[];
    h+=ms.length?ms.map(function(m){ return '<div class="bal maia dir"><span class="quem">Maia</span>'+esc(typeof m==='string'?m:(m.texto||JSON.stringify(m)))+'</div>'; }).join(''):'<div class="dica">'+ic('info')+'<span>A Maia não mandou texto (veja a conversa).</span></div>';
    h+='<div><b class="peq">Ferramentas que ela usou:</b> <div class="ferr">'+((resp.ferramentas||[]).length?resp.ferramentas.map(function(f){return '<code>'+esc(f)+'</code>';}).join(''):'<span class="mu peq">nenhuma</span>')+'</div></div>';
    if(resp.etapa) h+='<div class="peq">Etapa do contato agora: '+st({novo:['novo',''],conversando:['conversando','marca'],interessado:['interessado','marca'],proposta:['proposta','marca'],ganho:['ganho','bom'],perdido:['perdido','ruim']},resp.etapa)+'</div>';
  }
  h+='<details><summary class="ver">ver resposta completa</summary><pre class="json">'+esc(JSON.stringify(r,null,2))+'</pre></details>';
  el.innerHTML=h;
}

      '<div class="campo"><label for="c-texto">Mensagem</label><textarea id="c-texto" name="texto" placeholder="Ex.: oi, quanto custa a limpeza de pele?"></textarea></div>'+

    espera($('button',fd),arq?'enviando o arquivo…':'a Maia está pensando…',function(){
      var p=arq?lerB64(arq).then(function(b64){ return {acao:'simular_dono',negocio_id:n.id,arquivo_b64:b64,mime:arq.type||'image/jpeg',legenda:leg||texto||undefined}; })
               :Promise.resolve({acao:'simular_dono',negocio_id:n.id,texto:texto});
      return p.then(api).then(function(r){ S.cart=null; mostraResposta($('#r-dono'),r,'Dono'); fd.texto.value=''; fd.arquivo.value=''; fd.legenda.value=''; });
    });
  };
  var fc=$('#f-scli');
  fc.onsubmit=function(ev){ ev.preventDefault();

    if(!/^55000/.test(tel)){ toast('Não deu: no simulador o telefone tem que começar com 55000',true); return; }
    var arqC=fc.arquivo.files[0], txtC=fc.texto.value.trim();
    if(!txtC&&!arqC){ toast('Não deu: escreve uma mensagem ou escolhe um arquivo',true); return; }
    espera($('button',fc),'a Maia está pensando…',function(){
      var base={acao:'simular_cliente',negocio_id:n.id,telefone:tel,nome:fc.nome.value.trim()||undefined,texto:txtC};
      var p=arqC?lerB64(arqC).then(function(b64){ return Object.assign(base,{arquivo_b64:b64,mime:arqC.type||'image/jpeg',legenda:txtC||undefined}); }):Promise.resolve(base);
      return p.then(api).then(function(r){ S.cart=null; mostraResposta($('#r-cli'),r,'Cliente'); fc.texto.value=''; fc.arquivo.value=''; });
    });
  };
}
function lerB64(file){
  return new Promise(function(ok,falha){
    if(file.size>25*1024*1024) return falha(new Error('arquivo grande demais (máx. 25 MB)'));
    var r=new FileReader(); r.onload=function(){ ok(String(r.result).split(',')[1]||''); }; r.onerror=function(){ falha(new Error('não consegui ler o arquivo')); }; r.readAsDataURL(file);
  });
}

      '<div class="trilho gr" role="progressbar" aria-valuemin="0" aria-valuemax="500" aria-valuenow="'+ok+'" aria-label="Leituras bem-sucedidas"><i class="'+(ok>=500?'v':'')+'" style="width:'+Math.max(p,ok?2:0)+'%"></i></div>'+
      '<div class="tags" style="margin-top:12px">'+(r.faltam?chip('faltam '+inteiro(r.faltam),'aten'):chip('meta batida','bom','check'))+
        chip('erro '+(te==null?'—':pct(te)), te==null?'':(te<15?'bom':'ruim'))+chip(plural(Number(r.rodadas)||0,'rodada')+' em 15 dias','')+(r.ultimo?chip('última '+haQuanto(r.ultimo),'info','relogio'):'')+'</div>'+
      ((r.ultimos_erros||[]).length?'<div class="erro-box" style="margin-top:12px">'+ic('alerta')+'<span>'+esc(r.ultimos_erros.join(' · '))+'</span></div>':'')+
      (!ok&&!r.rodadas?'<p class="fr peq" style="margin-top:10px">Nenhuma rodada ainda. A contagem começa quando a rotina rodar.</p>':'');
  }).catch(function(e){ $('#rot-ch').innerHTML=caixaErro(e); });
  function pintaMod(){ api('acao=modelos').then(function(r){
      var ms=r.modelos||[];
      $('#rot-mod').innerHTML=ms.length?ms.map(function(m){ var s=String(m.status||'').toUpperCase(), tom=s==='APPROVED'?'bom':(s==='REJECTED'||s==='DISABLED'?'ruim':(s==='PENDING'||s==='IN_APPEAL'?'aten':''));
        var nome={APPROVED:'aprovado',REJECTED:'rejeitado',PENDING:'em análise',DISABLED:'desativado',PAUSED:'pausado',IN_APPEAL:'em recurso'}[s]||String(m.status||'?').toLowerCase();
        return '<div class="modelo"><span class="av">'+ic('carta')+'</span><div class="tx"><b>'+esc(m.name)+'</b><small>'+esc([m.language,m.category].filter(Boolean).join(' · '))+(m.rejected_reason&&m.rejected_reason!=='NONE'?' · motivo: '+esc(m.rejected_reason):'')+'</small></div>'+chip(nome,tom)+'</div>'; }).join('')
        :vazio('carta','Nenhum modelo da Maia ainda','Pede a aprovação do modelo do dono no botão abaixo.');
    }).catch(function(e){
      var m=String(e&&e.message||e);
      $('#rot-mod').innerHTML=/sem conta/i.test(m)?vazio('carta','Sem conta do WhatsApp pra consultar','Neste servidor não tem a conta do número da Maia configurada, então não dá pra ver os modelos.'):caixaErro(e);
    }); }
  pintaMod();
  $('#b-mod').onclick=function(){ var b=this; espera(b,'pedindo…',function(){ return api({acao:'criar_modelo_dono'}).then(function(r){ toast(r.ok?'Pedido de aprovação enviado ('+(r.status||'')+').':'Não deu: '+(r.erro||'?'), !r.ok); pintaMod(); }); }); };
  $('#b-rodar').onclick=function(){
    var b=this; espera(b,'rodando… pode levar um pouco',function(){
      return api({acao:'rodar_rotina',forcar_relatorio:$('#r-forcar').checked}).then(function(r){ pintaRotina(r); S.cart=null; atualizaResumo(); });
    });
  };
}
function pintaRotina(r){
  r=r||{};
  var conhecidas={}; TAREFAS.forEach(function(x){ conhecidas[x[0]]=1; });
  $$('#rot-tar [data-t]').forEach(function(el){
    var k=el.dataset.t, res=$('.res',el);
    if(k+'_erro' in r) res.innerHTML='<div class="erro-box" style="margin-top:4px">'+ic('alerta')+'<span>Não deu: '+esc(r[k+'_erro'])+'</span></div>';
    else if(k in r) res.innerHTML=chip('rodou: '+resumoTexto(r[k]),'bom','check');
    else res.innerHTML=chip('não rodou nesta vez','');
  });
  var outras=Object.keys(r).filter(function(k){ return !conhecidas[k.replace(/_erro$/,'')]; });
  $('#rot-quando').textContent='rodou agora, '+hora(new Date().toISOString());
  $('#rot-c').innerHTML=(outras.length?'<div class="dica" style="margin-top:12px">'+ic('info')+'<span>'+outras.map(function(k){ return esc(k.replace(/_/g,' '))+': '+esc(resumoTexto(r[k])); }).join(' · ')+'</span></div>':'')+
    '<details style="margin-top:10px"><summary class="ver">ver resultado completo</summary><pre class="json">'+esc(JSON.stringify(r,null,2))+'</pre></details>';
}
function resumoTexto(v){
  if(v==null) return 'nada';
  if(Array.isArray(v)) return v.length?plural(v.length,'item','itens'):'nada pra fazer';
  if(typeof v==='object'){ var ks=Object.keys(v); if(!ks.length) return 'nada pra fazer';
    return ks.map(function(k){ var x=v[k]; return k.replace(/_/g,' ')+': '+(Array.isArray(x)?x.length:(typeof x==='object'&&x!==null?JSON.stringify(x).slice(0,60):x)); }).join(' · '); }
  return String(v);
}

/* ---------- início ---------- */
S.senha=lsGet(CHAVE);
if(!S.senha) telaLogin();
else { montar(); atualizaResumo(); }
})();
</script>
