        if(a==='ligar'){ conf=id; return pinta(); } if(a==='nao'){ conf=null; return pinta(); }
        if(a==='ligar-sim') return espera(b,'ligando…',function(){ return api({acao:'ativar_campanha',campanha_id:id}).then(function(){ conf=null; S.cart=null; toast('Campanha ligada.'); return carrega(); }); });
        if(a==='pausar') return espera(b,'pausando…',function(){ return api({acao:'pausar_campanha',campanha_id:id}).then(function(){ S.cart=null; toast('Campanha pausada.'); return carrega(); }); });
      }; });
    });
  }
  carrega();
}

/* --- conversas (dono e clientes), estilo WhatsApp --- */
var QUEM={dono:'Dono',maia:'Maia',equipe:'Equipe',sistema:'Sistema',cliente:'Cliente'};
function balao(m,nomes,canal){
  var a=m.autor||'sistema', t=m.texto;
  var lado = a==='sistema'?'':((canal==='cliente'?(a==='cliente'):(a==='dono'||a==='cliente'))?'esq':'dir');
  var corpo = t?esc(t):'<span class="midia-t">'+ic(m.tipo==='imagem'||m.tipo==='image'?'imagem':'arquivo')+'('+esc(m.tipo||'mídia')+')</span>';
  return '<div class="bal '+esc(a)+' '+lado+'"><span class="quem">'+esc(nomes[a]||QUEM[a]||a)+'</span>'+corpo+'<span class="hora">'+hora(m.criado_em)+'</span></div>';
}
function bolhasComDia(msgs,nomes,canal){
  var h='', ult='';
  msgs.forEach(function(m){ var d=chaveDia(m.criado_em); if(d!==ult){ h+='<div class="dia">'+esc(rotuloDia(m.criado_em))+'</div>'; ult=d; } h+=balao(m,nomes,canal); });
  return h;
}
function subConversa(n,box){
  box.innerHTML='<div class="cv"><div class="card cv-lista" id="cv-l" aria-label="Conversas">'+esqLinhas(3)+'</div><div class="card cv-chat" id="cv-c"><div class="esq" style="height:420px;border-radius:0"></div></div></div>';
  var convs=[];
  function carrega(){
    return api(q({acao:'conversas',negocio:n.id})).then(function(cs){
      convs=(cs||[]).slice().sort(function(a,b){ if(a.canal==='dono'&&b.canal!=='dono') return -1; if(b.canal==='dono'&&a.canal!=='dono') return 1; return String(b.ultima_msg_em||'').localeCompare(String(a.ultima_msg_em||'')); });
      var dono=convs.filter(function(c){return c.canal==='dono';})[0]||null;
      if(!S.cvSel || !convs.some(function(c){return c.id===S.cvSel;})) S.cvSel=dono?dono.id:'__dono';
      pintaLista(); return abre();
    }).catch(function(e){ if($('#cv-c')) $('#cv-c').innerHTML='<div style="padding:16px">'+caixaErro(e)+'</div>'; if($('#cv-l')) $('#cv-l').innerHTML=''; });
  }
  function pintaLista(){
    var l=$('#cv-l'); if(!l) return;
    var temDono=convs.some(function(c){return c.canal==='dono';});
    var itens=(temDono?[]:[{id:'__dono',canal:'dono',nome:n.dono_nome,ultima_msg:'sem conversa ainda',modo:'ia'}]).concat(convs);
    l.innerHTML=itens.map(function(c){ var dono=c.canal==='dono', nm=dono?(n.dono_nome||'Dono'):(c.nome||c.telefone||'Cliente');
      return '<button type="button" class="cv-it'+(S.cvSel===c.id?' on':'')+'" data-cv="'+esc(c.id)+'"><span class="av '+(dono?'dono':'')+'">'+inicial(nm)+'</span><span class="tx"><b><span>'+esc(nm)+'</span><time>'+(c.ultima_msg_em?hora(c.ultima_msg_em):'')+'</time></b><small>'+esc(c.ultima_msg||'')+'</small><span class="tags">'+(dono?chip('dono','info'):chip('cliente',''))+(c.modo==='humano'?chip('equipe assumiu','aten'):'')+(c.nao_lidas?chip(c.nao_lidas+' sem ler','ruim'):'')+'</span></span></button>'; }).join('')+
      (convs.filter(function(c){return c.canal!=='dono';}).length?'':'<p class="fr peq" style="padding:8px 10px">Nenhum cliente conversou com a Maia ainda.</p>');
    $$('[data-cv]',l).forEach(function(b){ b.onclick=function(){ S.cvSel=b.dataset.cv; pintaLista(); abre(); }; });
  }
  function abre(){
    var cv=convs.filter(function(c){return c.id===S.cvSel;})[0]||null;
    if(!cv) return pinta(null,[]);
    return api(q({acao:'msgs',conversa:cv.id})).then(function(ms){ if(S.cvSel===cv.id) pinta(cv,ms||[]); }).catch(function(e){ if($('#cv-c')) $('#cv-c').innerHTML='<div style="padding:16px">'+caixaErro(e)+'</div>'; });
  }
  function pinta(cv,msgs){
    var c=$('#cv-c'); if(!c) return;
    var dono=!cv||cv.canal==='dono', humano=cv&&cv.modo==='humano';
    var nm=dono?(n.dono_nome||'Dono'):(cv.nome||cv.telefone||'Cliente');
    var nomes={dono:dono?nm:(n.dono_nome||'Dono'),cliente:dono?'Cliente':nm};
    c.innerHTML='<div class="cv-topo"><span class="av '+(dono?'dono':'')+'">'+inicial(nm)+'</span><div class="tx"><b>'+esc(nm)+'</b><small class="num">'+esc(dono?(n.dono_whatsapp||''):(cv.telefone||''))+' · '+(cv?(humano?'<b style="display:inline;color:var(--amber)">a equipe assumiu</b>':'a Maia está respondendo'):'sem conversa ainda')+'</small></div>'+
      '<div class="btns" style="flex:0 1 auto">'+(cv?(humano?'<button class="btn ok peq" id="b-devolver">'+ic('robo')+'Devolver pra Maia</button>':'<button class="btn peq" id="b-assumir">'+ic('pessoa')+'Assumir a conversa</button>'):'')+'<button class="btn fantasma peq" id="b-rec" aria-label="Atualizar a conversa">'+ic('rotina')+'</button></div></div>'+
      '<div class="chat" id="chat" aria-live="polite">'+(msgs.length?bolhasComDia(msgs,nomes,dono?'dono':'cliente'):'<div class="vazio"><div class="q">'+ic('msg')+'</div><b>Nenhuma mensagem ainda</b><p>'+(dono?'Quando o dono falar com a Maia no WhatsApp, aparece aqui.':'Nada nessa conversa ainda.')+'</p></div>')+'</div>'+
      (dono?'<form class="enviar" id="f-msg"><textarea name="texto" placeholder="Mensagem da equipe pro dono…" aria-label="Mensagem da equipe pro dono" required></textarea><button class="btn ok" aria-label="Mandar">'+ic('enviar')+'Mandar</button></form>'+
        '<p class="cv-nota">Vai como mensagem da equipe no WhatsApp da Maia.'+(humano?'':' Dica: assume a conversa antes, se não quiser que a Maia responda junto.')+'</p>'
        :'<p class="cv-so">Essa conversa é do cliente com o WhatsApp do negócio. Daqui tu acompanha e decide quem responde: a Maia, ou o dono pelo celular (assume a conversa pra ela ficar quieta).</p>');
    var ch=$('#chat'); ch.scrollTop=ch.scrollHeight;
    $('#b-rec').onclick=function(){ carrega(); };
    if($('#b-assumir')) $('#b-assumir').onclick=function(){ espera(this,'…',function(){ return api({acao:'assumir',conversa_id:cv.id}).then(function(){ S.cart=null; toast(dono?'A equipe assumiu. A Maia para de responder o dono.':'A equipe assumiu. A Maia para de responder esse cliente.'); return carrega(); }); }); };
    if($('#b-devolver')) $('#b-devolver').onclick=function(){ espera(this,'…',function(){ return api({acao:'devolver',conversa_id:cv.id}).then(function(){ S.cart=null; toast('Devolvido pra Maia.'); return carrega(); }); }); };
    var f=$('#f-msg');
    if(f){
      f.texto.onkeydown=function(ev){ if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); f.requestSubmit?f.requestSubmit():f.onsubmit(ev); } };
      f.onsubmit=function(ev){ ev.preventDefault(); var t=f.texto.value.trim(); if(!t) return;
        espera($('button',f),'…',function(){ return api({acao:'mandar_ao_dono',negocio_id:n.id,texto:t}).then(function(){ f.reset(); return carrega(); }); }); };
    }
  }
  carrega();
}

/* --- simulador --- */
function mostraResposta(el,r,quem){
  if(!r){ el.innerHTML='<div class="dica">'+ic('info')+'<span>A Maia não respondeu (a mensagem foi ignorada ou a conversa está com a equipe).</span></div>'; return; }
  var resp=r.respondeu, h='';
  if(r.recebido) h+='<div class="bal dono esq"><span class="quem">'+esc(quem)+' (o que chegou)</span>'+esc(r.recebido)+'</div>';
  if(!resp) h+='<div class="dica">'+ic('info')+'<span>'+(r.recebido!=null?'Mídia guardada. A Maia não responde na hora a foto/vídeo (o dono costuma mandar vários): manda um texto depois.':'Sem resposta da Maia.')+'</span></div>';
  else {
    var ms=resp.mensagens||[];
    h+=ms.length?ms.map(function(m){ return '<div class="bal maia dir"><span class="quem">Maia</span>'+esc(typeof m==='string'?m:(m.texto||JSON.stringify(m)))+'</div>'; }).join(''):'<div class="dica">'+ic('info')+'<span>A Maia não mandou texto (veja a conversa).</span></div>';
    h+='<div><b class="peq">Ferramentas que ela usou:</b> <div class="ferr">'+((resp.ferramentas||[]).length?resp.ferramentas.map(function(f){return '<code>'+esc(f)+'</code>';}).join(''):'<span class="mu peq">nenhuma</span>')+'</div></div>';
    if(resp.etapa) h+='<div class="peq">Etapa do contato agora: '+st({novo:['novo',''],conversando:['conversando','marca'],interessado:['interessado','marca'],proposta:['proposta','marca'],ganho:['ganho','bom'],perdido:['perdido','ruim']},resp.etapa)+'</div>';
  }
  h+='<details><summary class="ver">ver resposta completa</summary><pre class="json">'+esc(JSON.stringify(r,null,2))+'</pre></details>';
  el.innerHTML=h;
}
function subSimulador(n,box){
  var rnd=String(Math.floor(Math.random()*1e7)).padStart(7,'0');
  box.innerHTML='<div class="dica" style="margin-bottom:14px">'+ic('frasco')+'<span>Teste: nada sai pra Meta nem pro WhatsApp de verdade quando o telefone começa com 55000. Cada mensagem aciona a IA (custa um pouquinho).</span></div>'+
    '<div class="metade">'+
    '<form class="card" id="f-sdono"><h2>Falar como o dono</h2><p class="mu peq" style="margin:4px 0 14px">Como se fosse '+esc(n.dono_nome||'o dono')+' no WhatsApp.</p>'+
      '<div class="campo"><label for="s-texto">Mensagem</label><textarea id="s-texto" name="texto" placeholder="Ex.: oi Maia, vendi 2 limpezas de pele hoje pra Ana e pra Bia, 180 cada"></textarea></div>'+
      '<div class="campo"><label for="s-arq">Ou uma foto / vídeo</label><input id="s-arq" name="arquivo" type="file" accept="image/*,video/*,audio/*"></div>'+
      '<div class="campo"><label for="s-leg">Legenda da foto/vídeo</label><input id="s-leg" name="legenda" placeholder="opcional"></div>'+
      '<button class="btn ok larga">'+ic('enviar')+'Mandar como dono</button><div class="resp" id="r-dono"></div></form>'+
    '<form class="card" id="f-scli"><h2>Falar como um cliente do negócio</h2><p class="mu peq" style="margin:4px 0 14px">Como alguém que viu o anúncio e chamou.</p>'+
      '<div class="grade2"><div class="campo"><label for="c-tel">Telefone (fictício)</label><input id="c-tel" name="telefone" class="num" value="55000'+rnd+'"></div><div class="campo"><label for="c-nome">Nome</label><input id="c-nome" name="nome" placeholder="Ex.: Júlia"></div></div>'+
      '<div class="campo"><label for="c-texto">Mensagem</label><textarea id="c-texto" name="texto" required placeholder="Ex.: oi, quanto custa a limpeza de pele?"></textarea></div>'+
      '<button class="btn ok larga">'+ic('enviar')+'Mandar como cliente</button><div class="resp" id="r-cli"></div></form></div>';
  var fd=$('#f-sdono');
  fd.onsubmit=function(ev){ ev.preventDefault();
    var texto=fd.texto.value.trim(), arq=fd.arquivo.files[0], leg=fd.legenda.value.trim();
    if(!texto&&!arq){ toast('Não deu: escreve uma mensagem ou escolhe um arquivo',true); return; }
    espera($('button',fd),arq?'enviando o arquivo…':'a Maia está pensando…',function(){
      var p=arq?lerB64(arq).then(function(b64){ return {acao:'simular_dono',negocio_id:n.id,arquivo_b64:b64,mime:arq.type||'image/jpeg',legenda:leg||texto||undefined}; })
               :Promise.resolve({acao:'simular_dono',negocio_id:n.id,texto:texto});
      return p.then(api).then(function(r){ S.cart=null; mostraResposta($('#r-dono'),r,'Dono'); fd.texto.value=''; fd.arquivo.value=''; fd.legenda.value=''; });
    });
  };
  var fc=$('#f-scli');
  fc.onsubmit=function(ev){ ev.preventDefault();
    var tel=fc.telefone.value.replace(/\D/g,'');
    if(!/^55000/.test(tel)){ toast('Não deu: no simulador o telefone tem que começar com 55000',true); return; }
    espera($('button',fc),'a Maia está pensando…',function(){
      return api({acao:'simular_cliente',negocio_id:n.id,telefone:tel,nome:fc.nome.value.trim()||undefined,texto:fc.texto.value.trim()}).then(function(r){ S.cart=null; mostraResposta($('#r-cli'),r,'Cliente'); fc.texto.value=''; });
    });
  };
}
function lerB64(file){
  return new Promise(function(ok,falha){
    if(file.size>25*1024*1024) return falha(new Error('arquivo grande demais (máx. 25 MB)'));
    var r=new FileReader(); r.onload=function(){ ok(String(r.result).split(',')[1]||''); }; r.onerror=function(){ falha(new Error('não consegui ler o arquivo')); }; r.readAsDataURL(file);
  });
}

/* ---------- 4. ROTINA ---------- */
var TAREFAS=[
  ['retomadas','Retomadas','relogio','Volta a chamar os clientes que pararam de responder.'],
  ['confirmacoes','Confirmação de vendas com o dono','festa','Pergunta pro dono se as vendas combinadas fecharam.'],
  ['relatorios','Resumos da semana','arquivo','Escreve o resumo da semana de cada negócio. Vai pra fila da equipe aprovar.'],
  ['metricas','Números da Meta','barras','Busca o investimento e as conversas dos anúncios.'],
  ['chamadas','Leituras da Meta (as 500 chamadas)','alvo','Faz as leituras que contam pra liberar os anúncios nas contas dos clientes.']
];
function telaRotina(){
  var t=$('#tela');
  t.innerHTML=cab('Rotina','O que roda sozinho todo dia, sem ninguém precisar lembrar.','<button class="btn pri" id="b-rodar">'+ic('play')+'Rodar a rotina agora</button>')+
    '<div class="dois">'+
    '<section class="card" aria-labelledby="t-tar"><div class="card-cab"><h2 id="t-tar">O que roda sozinho</h2><span id="rot-quando" class="mu peq"></span></div><div class="tarefas" id="rot-tar">'+
      TAREFAS.map(function(x){ return '<div class="tarefa" data-t="'+x[0]+'"><span class="q">'+ic(x[2])+'</span><div class="tx"><b>'+x[1]+'</b><small>'+x[3]+'</small><div class="res"></div></div></div>'; }).join('')+
      '</div><div class="chave" style="margin-top:6px;padding-bottom:0"><div class="txt"><b>Forçar o resumo da semana</b><small>Na próxima rodada, gera o relatório agora, mesmo fora do dia certo. Vai pra fila da equipe aprovar.</small></div><label class="sw"><span class="sr">Forçar o resumo da semana</span><input type="checkbox" id="r-forcar"><span></span></label></div>'+
      '<div id="rot-c"></div></section>'+
    '<div class="pilha">'+
    '<section class="card" aria-labelledby="t-ch"><div class="card-cab"><h2 id="t-ch">Meta: as 500 chamadas</h2></div><p class="mu peq" style="margin-bottom:14px">Pra liberar os anúncios nas contas dos clientes, a Meta exige 500 leituras bem-sucedidas em 15 dias, com menos de 15% de erro. A rotina faz isso toda hora nas contas da CND e da escola.</p><div id="rot-ch"><div class="esq" style="height:34px;width:50%"></div><div class="esq" style="height:14px;margin-top:12px"></div></div></section>'+
    '<section class="card" aria-labelledby="t-mod"><div class="card-cab"><h2 id="t-mod">Modelos de mensagem</h2></div><p class="mu peq" style="margin-bottom:10px">Fora da janela de 24 h, o WhatsApp só deixa mandar modelo aprovado. O do dono (maia_novidades) fica no número da Maia; os de cliente são criados na conta de cada negócio quando ele conecta.</p><div id="rot-mod">'+esqLinhas(2)+'</div><button class="btn larga" id="b-mod" style="margin-top:12px">'+ic('carta')+'Pedir aprovação do modelo do dono</button></section>'+
    '</div></div>';
  api('acao=chamadas').then(function(r){
    var ok=Number(r.ok)||0, p=Math.min(100,Math.round(ok/500*100)), te=r.taxa_erro;
    $('#rot-ch').innerHTML='<div class="placar"><b class="relevo-numero">'+inteiro(ok)+'</b><span>de 500 bem-sucedidas</span></div>'+
      '<div class="trilho gr" role="progressbar" aria-valuemin="0" aria-valuemax="500" aria-valuenow="'+ok+'" aria-label="Leituras bem-sucedidas"><i class="'+(ok>=500?'v':'')+'" style="width:'+Math.max(p,ok?2:0)+'%"></i></div>'+
      '<div class="tags" style="margin-top:12px">'+(r.faltam?chip('faltam '+inteiro(r.faltam),'aten'):chip('meta batida','bom','check'))+
        chip('erro '+(te==null?'—':pct(te)), te==null?'':(te<15?'bom':'ruim'))+chip(plural(Number(r.rodadas)||0,'rodada')+' em 15 dias','')+(r.ultimo?chip('última '+haQuanto(r.ultimo),'info','relogio'):'')+'</div>'+
      ((r.ultimos_erros||[]).length?'<div class="erro-box" style="margin-top:12px">'+ic('alerta')+'<span>'+esc(r.ultimos_erros.join(' · '))+'</span></div>':'')+
      (!ok&&!r.rodadas?'<p class="fr peq" style="margin-top:10px">Nenhuma rodada ainda. A contagem começa quando a rotina rodar.</p>':'');
  }).catch(function(e){ $('#rot-ch').innerHTML=caixaErro(e); });
  function pintaMod(){ api('acao=modelos').then(function(r){
      var ms=r.modelos||[];
      $('#rot-mod').innerHTML=ms.length?ms.map(function(m){ var s=String(m.status||'').toUpperCase(), tom=s==='APPROVED'?'bom':(s==='REJECTED'||s==='DISABLED'?'ruim':(s==='PENDING'||s==='IN_APPEAL'?'aten':''));
        var nome={APPROVED:'aprovado',REJECTED:'rejeitado',PENDING:'em análise',DISABLED:'desativado',PAUSED:'pausado',IN_APPEAL:'em recurso'}[s]||String(m.status||'?').toLowerCase();
        return '<div class="modelo"><span class="av">'+ic('carta')+'</span><div class="tx"><b>'+esc(m.name)+'</b><small>'+esc([m.language,m.category].filter(Boolean).join(' · '))+(m.rejected_reason&&m.rejected_reason!=='NONE'?' · motivo: '+esc(m.rejected_reason):'')+'</small></div>'+chip(nome,tom)+'</div>'; }).join('')
        :vazio('carta','Nenhum modelo da Maia ainda','Pede a aprovação do modelo do dono no botão abaixo.');
    }).catch(function(e){
      var m=String(e&&e.message||e);
      $('#rot-mod').innerHTML=/sem conta/i.test(m)?vazio('carta','Sem conta do WhatsApp pra consultar','Neste servidor não tem a conta do número da Maia configurada, então não dá pra ver os modelos.'):caixaErro(e);
    }); }
  pintaMod();
  $('#b-mod').onclick=function(){ var b=this; espera(b,'pedindo…',function(){ return api({acao:'criar_modelo_dono'}).then(function(r){ toast(r.ok?'Pedido de aprovação enviado ('+(r.status||'')+').':'Não deu: '+(r.erro||'?'), !r.ok); pintaMod(); }); }); };
  $('#b-rodar').onclick=function(){
    var b=this; espera(b,'rodando… pode levar um pouco',function(){
      return api({acao:'rodar_rotina',forcar_relatorio:$('#r-forcar').checked}).then(function(r){ pintaRotina(r); S.cart=null; atualizaResumo(); });
    });
  };
}
function pintaRotina(r){
  r=r||{};
  var conhecidas={}; TAREFAS.forEach(function(x){ conhecidas[x[0]]=1; });
  $$('#rot-tar [data-t]').forEach(function(el){
    var k=el.dataset.t, res=$('.res',el);
    if(k+'_erro' in r) res.innerHTML='<div class="erro-box" style="margin-top:4px">'+ic('alerta')+'<span>Não deu: '+esc(r[k+'_erro'])+'</span></div>';
    else if(k in r) res.innerHTML=chip('rodou: '+resumoTexto(r[k]),'bom','check');
    else res.innerHTML=chip('não rodou nesta vez','');
  });
  var outras=Object.keys(r).filter(function(k){ return !conhecidas[k.replace(/_erro$/,'')]; });
  $('#rot-quando').textContent='rodou agora, '+hora(new Date().toISOString());
  $('#rot-c').innerHTML=(outras.length?'<div class="dica" style="margin-top:12px">'+ic('info')+'<span>'+outras.map(function(k){ return esc(k.replace(/_/g,' '))+': '+esc(resumoTexto(r[k])); }).join(' · ')+'</span></div>':'')+
    '<details style="margin-top:10px"><summary class="ver">ver resultado completo</summary><pre class="json">'+esc(JSON.stringify(r,null,2))+'</pre></details>';
}
function resumoTexto(v){
  if(v==null) return 'nada';
  if(Array.isArray(v)) return v.length?plural(v.length,'item','itens'):'nada pra fazer';
  if(typeof v==='object'){ var ks=Object.keys(v); if(!ks.length) return 'nada pra fazer';
    return ks.map(function(k){ var x=v[k]; return k.replace(/_/g,' ')+': '+(Array.isArray(x)?x.length:(typeof x==='object'&&x!==null?JSON.stringify(x).slice(0,60):x)); }).join(' · '); }
  return String(v);
}

/* ---------- início ---------- */
S.senha=lsGet(CHAVE);
if(!S.senha) telaLogin();
else { montar(); atualizaResumo(); }
})();
