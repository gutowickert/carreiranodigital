<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Relatório do mês · Maia</title>
<link rel="icon" href="/maia/img/maia-avatar.webp">
<!-- Maia: o RELATÓRIO DO MÊS do dono (13/11, lib/maia/relatorios.ts). Abre pelo link que vai no WhatsApp: /maia/relatorio?t=<token do painel>&id=<peça>.
     Igual ao painel do dono: troca o token por um cookie httpOnly (POST /api/maia/painel entrar), tira o token da barra
     de endereço e abre a página do relatório, que o servidor monta só pro negócio do cookie (GET /api/maia/painel?acao=relatorio). -->
<style>
body{margin:0;background:#f7f5fc;color:#1b1530;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.caixa{max-width:420px;text-align:center}.caixa p{color:#423a5c}a{color:#7c3aed;font-weight:700}
</style>
</head>
<body>
<div class="caixa" id="msg"><p>Abrindo o teu relatório…</p></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),t=q.get('t'),id=q.get('id')||'';
  var falha=function(m){document.getElementById('msg').innerHTML='<p>'+m+'</p><p><a href="/maia/painel">Abrir o painel</a></p>';};
  if(!/^[0-9a-f-]{36}$/i.test(id)){falha('Esse link do relatório está incompleto. Pede de novo pra Maia no WhatsApp: "me manda o relatório do mês".');return;}
  try{history.replaceState(null,'',location.pathname+'?id='+encodeURIComponent(id));}catch(e){}
  var abre=function(){location.replace('/api/maia/painel?acao=relatorio&id='+encodeURIComponent(id));};
  if(!t){abre();return;}
  fetch('/api/maia/painel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({acao:'entrar',t:t}),credentials:'same-origin'})
    .then(function(r){if(r.ok)abre();else falha('Esse link venceu ou não vale mais. Pede um novo pra Maia no WhatsApp: "me manda o relatório do mês".');})
    .catch(function(){falha('Não deu pra abrir agora. Tenta de novo em um minuto.');});
})();
</script>
</body>
</html>
