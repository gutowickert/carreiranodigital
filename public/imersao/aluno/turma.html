<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Imersão Deu Venda · a turma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
/* Imersão Deu Venda (16/10/2026): o painel do professor. Cada aluno tem um link só dele (index.html?c=<codigo>)
   e aqui aparece onde cada um está. Os passos saem da própria página do aluno (um lugar só pra manter).
   Dados: /api/imersao (tabela imersao_alunos), senha = a do painel do Recado. Padrão visual: DESIGN.md da escola. */
:root{--bg:#0f0c17;--surface:#171320;--surface-2:#1f1a2b;--border:#261f36;--border-strong:#372e4c;--text:#f4f1fb;--text-2:#c9c2da;--text-muted:#9a93ae;--text-faint:#736c88;
--accent:#8b5cf6;--accent-soft:#b39bff;--accent-bg:#2a1b4d;--green:#34d399;--green-bg:#0b2e24;--red:#fb7185;--red-bg:#3b1520;--amber:#fbbf24;--amber-bg:#3a2a0a;
--grad:linear-gradient(135deg,#7c3aed,#c026d3);--grad-escuro:#4c1d95;--glow:rgba(139,92,246,.35);
--glass:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));--glass-border:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.26);--glass-shadow:0 18px 50px rgba(0,0,0,.55);
--blob-1:rgba(139,92,246,.60);--blob-2:rgba(217,70,239,.42);--blob-3:rgba(56,189,248,.26);color-scheme:dark}
[data-theme="light"]{--bg:#f6f4fb;--surface:#fff;--surface-2:#f1eef8;--border:#e4dff0;--border-strong:#cfc8e3;--text:#17122a;--text-2:#3d3654;--text-muted:#6e6885;--text-faint:#9891ad;
--accent:#6d28d9;--accent-soft:#6d28d9;--accent-bg:#ede7fb;--green:#15803d;--green-bg:#d6f5e0;--red:#dc2626;--red-bg:#fde7e7;--amber:#b45309;--amber-bg:#fdeecb;--grad-escuro:#3b1a7a;--glow:rgba(109,40,217,.22);
--glass:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.50));--glass-border:rgba(255,255,255,.92);--glass-hi:#fff;--glass-shadow:0 14px 40px rgba(76,29,149,.13);
--blob-1:rgba(139,92,246,.42);--blob-2:rgba(217,70,239,.30);--blob-3:rgba(56,189,248,.22);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh}
.luz{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(40% 44% at 14% 6%,var(--blob-1),transparent 70%),radial-gradient(30% 34% at 90% 92%,var(--blob-2),transparent 70%),radial-gradient(26% 30% at 64% 42%,var(--blob-3),transparent 70%)}
.pagina{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:28px 80px;display:grid;gap:22px}
.vidro{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-shadow);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
h1,h2{font-family:'Bricolage Grotesque',Manrope,sans-serif;font-variation-settings:'opsz' 96,'wdth' 85;letter-spacing:-.025em}
h1{font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1}h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:700;font-size:24px;line-height:1.1}
.olho{font:800 11px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.topo{padding:clamp(18px,4vw,30px);display:grid;gap:12px}
.linha{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input,select,.bt{font:600 14px Manrope;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:9px 12px;max-width:100%}
.bt{cursor:pointer;display:inline-flex;align-items:center;gap:6px}.bt:hover{border-color:var(--accent)}
.bt.p{background:var(--grad);color:#fff;border:0;box-shadow:0 3px 0 var(--grad-escuro),0 12px 20px -8px var(--glow)}
.bt.mini{padding:6px 10px;font-size:12.5px}
form.novo{display:flex;gap:8px;flex-wrap:wrap}form.novo input{flex:1 1 160px}
.msg{font-size:14px;color:var(--text-muted)}.msg.erro{color:var(--amber)}
.turma{display:grid;gap:12px}
.turma .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cartoes{display:grid;gap:10px}
.aluno{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.aluno .l1{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.aluno b{font:700 16px Manrope}.aluno .neg{color:var(--text-muted);font-size:13.5px}
.onde{font-size:14px;color:var(--text-2)}.onde em{font-style:normal;color:var(--accent-soft);font-weight:700}
.barra{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}.barra i{display:block;height:100%;background:var(--grad)}
.etps{display:flex;gap:6px;flex-wrap:wrap}
.etp{font:700 12px Manrope;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-muted)}
.etp.ok{background:var(--green-bg);color:var(--green)}.etp.meio{background:var(--accent-bg);color:var(--accent-soft)}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.quando{font-size:12.5px;color:var(--text-faint)}
details.lista summary{cursor:pointer;font:700 13px Manrope;color:var(--accent-soft);list-style:none}details.lista summary::-webkit-details-marker{display:none}
details.lista ol{margin-top:8px;padding-left:0;list-style:none;display:grid;gap:3px;font-size:13.5px}
details.lista li{display:flex;gap:8px;color:var(--text-muted)}details.lista li.ok{color:var(--text)}details.lista li span{flex:none;width:18px;color:var(--text-faint)}details.lista li.ok span{color:var(--green)}
details.lista li small{margin-left:auto;color:var(--text-faint);white-space:nowrap}
details.lista h4{font:800 10.5px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-top:8px}
.vazio{color:var(--text-muted);font-size:14px;padding:6px 2px}
[hidden]{display:none!important}#turmas{display:grid;gap:22px}
@media (max-width:560px){.aluno .l1{flex-direction:column}}
</style></head><body>
<div class="luz" aria-hidden="true"></div>
<main class="pagina">
<header class="vidro topo">
  <div class="linha"><span class="olho">Imersão Deu Venda · só o professor</span><button class="bt mini" id="tema" type="button">Claro / escuro</button></div>
  <h1>Onde cada aluno <span class="g">está</span></h1>
  <p class="msg">Cada aluno tem um link só dele. O que ele marca lá aparece aqui. Atualiza sozinho a cada 30 segundos.</p>
  <form class="linha" id="entrar"><input type="password" id="senha" placeholder="Senha do painel" autocomplete="current-password" required><button class="bt p">Entrar</button><span class="msg" id="msgEntrar"></span></form>
</header>

<section class="vidro topo" id="cadastro" hidden>
  <h2>Cadastrar aluno</h2>
  <form class="novo" id="novo">
    <input id="nNome" placeholder="Nome do aluno" required>
    <input id="nNeg" placeholder="Negócio (ex.: Ótica Bom Olhar)">
    <input id="nWa" placeholder="WhatsApp (só números, com DDD)" inputmode="numeric">
    <select id="nTurma"><option value="poa-tarde">Porto Alegre · tarde</option><option value="laj-noite">Lajeado · noite</option></select>
    <button class="bt p">Criar o link</button>
  </form>
  <span class="msg" id="msgNovo"></span>
</section>

<div id="turmas"></div>
</main>
<script>
(function(){
  var ls=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  var tema=ls('imersao-dv-tema');if(tema)document.documentElement.dataset.theme=tema
  document.getElementById('tema').onclick=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;ls('imersao-dv-tema',n)}
  var NOMES={'poa-tarde':'Porto Alegre · tarde · 20, 21, 22/10 e 3/11','laj-noite':'Lajeado · noite · 27, 28, 29/10 e 9/11','poa-noite':'Porto Alegre · noite'}
  var senha=ls('imersao-dv-senha')||'',ETAPAS=[],PASSOS=[],timer=null
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var link=function(c){return location.origin+'/imersao/aluno?c='+c}
  function quando(iso){if(!iso)return 'nunca abriu o link';var d=new Date(iso),m=(Date.now()-d)/60000
    if(m<2)return 'abriu agora';if(m<60)return 'abriu há '+Math.round(m)+' min';if(m<1440)return 'abriu há '+Math.round(m/60)+' h'
    return 'abriu em '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
  function hora(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
  // os passos saem da página do aluno: um lugar só pra manter
  function lerPassos(){return fetch('/imersao/aluno/index.html',{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){
    var d=new DOMParser().parseFromString(h,'text/html')
    d.querySelectorAll('section.etapa').forEach(function(s){var t=(s.querySelector('h2')||{}).textContent||s.id,curto=(s.querySelector('nav')||{}).textContent
      var nav=d.querySelector('nav.etapas a[data-e="'+s.id+'"]'),rot=nav?nav.childNodes[0].textContent.trim():t
      var ps=[].slice.call(s.querySelectorAll('.passo')).map(function(p){var h3=p.querySelector('h3'),tt=h3?h3.childNodes[0].textContent.trim():p.dataset.id;return{id:p.dataset.id,t:tt,e:s.id}})
      ETAPAS.push({id:s.id,t:rot,passos:ps});PASSOS=PASSOS.concat(ps)})})}
  function api(metodo,corpo,qs){return fetch('/api/imersao'+(qs||''),{method:metodo,headers:{'Content-Type':'application/json','x-senha':senha},body:corpo?JSON.stringify(corpo):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j.erro||r.status;return j})})}
  function carregar(){return api('GET',null,'?todos=1').then(function(j){desenha(j.alunos||[])})}
  function desenha(alunos){
    var porTurma={};alunos.forEach(function(a){(porTurma[a.turma]=porTurma[a.turma]||[]).push(a)})
    var ordem=['poa-tarde','laj-noite','poa-noite'].filter(function(t){return porTurma[t]||t!=='poa-noite'})
    document.getElementById('turmas').innerHTML=ordem.map(function(t){var l=porTurma[t]||[]
      return '<section class="vidro topo turma"><div class="cab"><h2>'+esc(NOMES[t]||t)+'</h2><span class="msg">'+l.length+' aluno'+(l.length===1?'':'s')+'</span></div><div class="cartoes">'+
        (l.length?l.map(cartao).join(''):'<p class="vazio">Ninguém cadastrado ainda.</p>')+'</div></section>'}).join('')
    document.querySelectorAll('[data-copiar]').forEach(function(b){b.onclick=function(){var t=b.dataset.copiar
      var ok=function(){b.textContent='copiado';setTimeout(function(){b.textContent='Copiar o link'},1500)}
      if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,function(){prompt('Copia o link:',t)});else prompt('Copia o link:',t)}})
    document.querySelectorAll('[data-apagar]').forEach(function(b){b.onclick=function(){if(!confirm('Apagar '+b.dataset.nome+' e o progresso dele? Não tem volta.'))return
      api('POST',{acao:'apagar',c:b.dataset.apagar}).then(carregar).catch(function(e){alert('Não apagou: '+e)})}})
  }
  function cartao(a){var f=a.feitos||{},tot=PASSOS.length,ok=PASSOS.filter(function(p){return f[p.id]}).length
    // onde está: o primeiro passo ainda não feito, na ordem da página
    var prox=PASSOS.filter(function(p){return !f[p.id]})[0],et=prox&&ETAPAS.filter(function(e){return e.id===prox.e})[0]
    var onde=tot&&ok===tot?'<em>Fez tudo.</em>':prox?'Próximo: <em>'+esc(prox.t)+'</em> · '+esc(et?et.t:''):''
    var chips=ETAPAS.map(function(e){var k=e.passos.filter(function(p){return f[p.id]}).length,cl=k===e.passos.length&&k?'ok':k?'meio':''
      return '<span class="etp '+cl+'">'+esc(e.t.replace(/ · .*/,''))+' '+k+'/'+e.passos.length+'</span>'}).join('')
    var lista=ETAPAS.map(function(e){return '<h4>'+esc(e.t)+'</h4>'+e.passos.map(function(p){return '<li class="'+(f[p.id]?'ok':'')+'"><span>'+(f[p.id]?'✓':'·')+'</span>'+esc(p.t)+(f[p.id]?'<small>'+hora(f[p.id])+'</small>':'')+'</li>'}).join('')}).join('')
    var wa=a.whatsapp?String(a.whatsapp).replace(/\D/g,''):'',txt=encodeURIComponent('Oi '+String(a.nome).split(' ')[0]+'! Este é o teu passo a passo da Imersão Deu Venda, só teu: '+link(a.codigo))
    return '<article class="aluno"><div class="l1"><div><b>'+esc(a.nome)+'</b>'+(a.negocio?'<div class="neg">'+esc(a.negocio)+'</div>':'')+'</div>'+
      '<div class="acoes"><button class="bt mini" data-copiar="'+esc(link(a.codigo))+'">Copiar o link</button>'+
      (wa?'<a class="bt mini" target="_blank" rel="noopener" href="https://wa.me/'+(wa.length<=11?'55'+wa:wa)+'?text='+txt+'">Mandar no WhatsApp</a>':'')+
      '<a class="bt mini" target="_blank" rel="noopener" href="'+esc(link(a.codigo))+'">Abrir</a>'+
      '<button class="bt mini" data-apagar="'+esc(a.codigo)+'" data-nome="'+esc(a.nome)+'">Apagar</button></div></div>'+
      '<div class="barra"><i style="width:'+(tot?ok*100/tot:0)+'%"></i></div>'+
      '<div class="linha"><span class="onde">'+ok+' de '+tot+' passos · '+onde+'</span><span class="quando">'+quando(a.ultimo_acesso)+'</span></div>'+
      '<div class="etps">'+chips+'</div>'+
      '<details class="lista"><summary>Ver todos os passos</summary><ol>'+lista+'</ol></details></article>'}
  function liga(){document.getElementById('cadastro').hidden=false;document.getElementById('entrar').hidden=true
    clearInterval(timer);timer=setInterval(function(){if(!document.hidden&&!document.querySelector('details.lista[open]'))carregar().catch(function(){})},30000)}
  document.getElementById('entrar').onsubmit=function(ev){ev.preventDefault();senha=document.getElementById('senha').value.trim()
    carregar().then(function(){ls('imersao-dv-senha',senha);liga()}).catch(function(e){document.getElementById('msgEntrar').textContent=e==='senha'?'Senha errada.':'Não consegui abrir: '+e})}
  document.getElementById('novo').onsubmit=function(ev){ev.preventDefault();var m=document.getElementById('msgNovo')
    api('POST',{acao:'criar',nome:document.getElementById('nNome').value,negocio:document.getElementById('nNeg').value,whatsapp:document.getElementById('nWa').value,turma:document.getElementById('nTurma').value})
      .then(function(j){m.className='msg';m.textContent='Pronto. Link de '+j.aluno.nome+': '+link(j.aluno.codigo);ev.target.reset();return carregar()})
      .catch(function(e){m.className='msg erro';m.textContent='Não criou: '+e})}
  lerPassos().then(function(){if(senha)carregar().then(liga).catch(function(){senha=''})})
})()
</script>
</body></html>
