<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Seu recado encantado</title><meta name="theme-color" content="#2a1f6b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap">
<style>
:root{--noite:#2a1f6b;--rosa:#e6457a;--ouro:#f2c14e;--creme:#fffaf0;--creme2:#f3ead8;--texto:#3a2414;--suave:#8a7766}
*{box-sizing:border-box;margin:0}body{font-family:Fredoka,system-ui,sans-serif;background:linear-gradient(180deg,var(--noite),#4b2a7a 60%,#7a3e8f);color:var(--texto);min-height:100vh;padding:24px 16px 60px}
.ct{max-width:560px;margin:0 auto;display:grid;gap:18px}
.logo{width:180px;margin:0 auto;display:block}
.card{background:var(--creme);border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:grid;gap:14px}
h1{font-family:'Dancing Script',cursive;font-size:44px;color:var(--rosa);text-align:center;line-height:1.05}
p{font-size:18px;line-height:1.45;text-align:center}
.passos{display:grid;gap:10px;margin-top:6px}
.passo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--creme2);font-weight:600;color:var(--suave)}
.passo i{width:30px;height:30px;border-radius:50%;background:var(--creme2);display:grid;place-items:center;font-style:normal;flex:none}
.passo.feito{color:var(--texto);border-color:#cfe9d8}.passo.feito i{background:#2fbf71;color:#fff}
.passo.agora{color:var(--texto);border-color:var(--ouro)}.passo.agora i{background:var(--ouro);animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.4}}
video{width:100%;border-radius:18px;background:#000}
.bts{display:grid;gap:10px}.bt{display:block;text-align:center;padding:14px;border-radius:999px;font-weight:700;font-size:18px;text-decoration:none;color:#fff;background:var(--rosa)}.bt.claro{background:#fff;color:var(--rosa);border:2px solid var(--rosa)}
.msg{background:#fff;border-radius:16px;padding:16px;font-size:17px;line-height:1.45;border-left:5px solid var(--ouro)}
small{display:block;text-align:center;color:var(--creme2);font-size:14px}
</style></head><body><div class="ct">
<img class="logo" src="/recado/midia/logo.png" alt="Recado Encantado">
<div class="card" id="card"><h1 id="tit">Recebemos!</h1><p id="sub">Carregando o teu pedido...</p><div class="passos" id="passos"></div></div>
<small>Dúvidas? Responde a mensagem que chegou no teu WhatsApp. Se não ficar mágico, a gente refaz ou devolve o dinheiro.</small>
</div>
<script>
var c=new URLSearchParams(location.search).get('c')||'',ordem=['aguardando_pagamento','pago','produzindo','entregue']
var NOMES={aguardando_pagamento:'Pagamento',pago:'Na fila dos duendes',produzindo:'Gravando o vídeo',entregue:'Pronto pra assistir'}
function desenha(s){
  var quem=s.personagem==='fada'?'a Fada do Dente':'o Papai Noel'
  if(s.status==='entregue'){
    document.getElementById('tit').textContent='O recado chegou!'
    document.getElementById('sub').textContent=quem.charAt(0).toUpperCase()+quem.slice(1)+' gravou um vídeo especial pra '+s.nome+'.'
    document.getElementById('passos').outerHTML='<video controls playsinline src="'+s.video+'"></video>'+(s.mensagem?'<div class="msg">'+s.mensagem.replace(/</g,'&lt;')+'</div>':'')+
      '<div class="bts"><a class="bt" href="'+s.video+'" download>Baixar o vídeo</a>'+(s.certificado?'<a class="bt claro" href="'+s.certificado+'" download>Baixar o certificado</a>':'')+(s.carta?'<a class="bt claro" href="'+s.carta+'" download>Baixar a carta</a>':'')+'</div>'
    return true }
  var i=Math.max(0,ordem.indexOf(s.status))
  document.getElementById('tit').textContent=s.status==='aguardando_pagamento'?'Quase lá!':'Tudo certo!'
  document.getElementById('sub').textContent=s.status==='aguardando_pagamento'?'Assim que o pagamento confirmar, '+quem+' começa a gravar o recado pra '+s.nome+'.':(s.etapa||'')+'. Chega no teu WhatsApp em até 2 horas, e também aparece aqui.'
  document.getElementById('passos').innerHTML=ordem.map(function(o,k){return '<div class="passo '+(k<i||(k===i&&o==='entregue')?'feito':k===i?'agora':'')+'"><i>'+(k<i?'✓':k+1)+'</i>'+NOMES[o]+'</div>'}).join('')
  return false }
function busca(){fetch('/api/recado/status?c='+encodeURIComponent(c)).then(function(r){return r.json()}).then(function(s){if(s.erro){document.getElementById('sub').textContent='Não encontramos esse pedido. Confere o link que chegou no WhatsApp.';return}if(!desenha(s))setTimeout(busca,15000)}).catch(function(){setTimeout(busca,20000)})}
busca()
</script></body></html>
